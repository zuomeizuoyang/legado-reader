<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="书源阅读">
<!-- 状态栏跟随主题：日间 default（浅底深字），夜间 black（黑底白字）。
     写死 black 的话日间顶上也是一条黑边，很突兀。
     这个 meta 只在 PWA 启动时被完整读取，所以下面用一段内联脚本先按上次的主题定调，
     免得夜间用户冷启动时先闪一下浅色。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
try{
  if(localStorage.getItem('rd_theme') === 'dark'){
    document.documentElement.classList.add('rd-night');
    document.documentElement.style.background = '#000';
    var bm = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if(bm) bm.setAttribute('content','black');
  }
}catch(e){}
</script>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f4ef">
<title>书源阅读</title>
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#faf8f4; --text:#1c1a17; --sub:#8b857c;
  --line:#e9e4da; --accent:#b3541e; --accent-soft:#f6e9e0; --shadow:0 1px 3px rgba(0,0,0,.05);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#111110; --surface:#1b1b19; --surface2:#232320; --text:#ddd8d0; --sub:#8a857c;
  --line:#2c2c28; --accent:#e0895a; --accent-soft:#2a211b; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
@supports (height:100dvh){ html,body{height:100dvh} }
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;font-size:inherit}
input,textarea{font-family:inherit;font-size:16px;color:inherit}
::-webkit-scrollbar{width:0;height:0}

/* ---------- 布局 ---------- */
.app{height:100%;display:flex;flex-direction:column;position:relative}
#main{flex:1;position:relative;overflow:hidden}
.page{
  position:absolute;inset:0;display:none;flex-direction:column;
  padding-top:var(--safe-t);
}
.page.active{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.hd{
  padding:14px 18px 8px;display:flex;align-items:baseline;gap:10px;flex:0 0 auto;
}
.hd h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.4px}
.hd .hd-sub{font-size:12px;color:var(--sub)}
.hd-actions{margin-left:auto;display:flex;gap:6px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1px solid var(--line);font-size:15px;
}
.icon-btn:active{transform:scale(.94)}

/* ---------- 搜索页 ---------- */
.searchwrap{padding:4px 16px 12px;flex:0 0 auto}
.searchbar{
  display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);
}
.searchbar input{flex:1;border:0;outline:0;background:none;padding:9px 0;min-width:0}
.searchbar input::placeholder{color:var(--sub)}
.btn-go{
  background:var(--accent);color:#fff;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;
  flex:0 0 auto;
}
.btn-go:active{opacity:.8}
.status{padding:0 18px 6px;font-size:12.5px;color:var(--sub);min-height:18px;flex:0 0 auto}

/* ---------- 列表 ---------- */
.list{padding:0 12px 90px}
.row{
  display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);margin-bottom:10px;align-items:flex-start;position:relative;
}
.row:active{background:var(--surface2)}
.cover{
  width:56px;height:76px;border-radius:8px;flex:0 0 auto;overflow:hidden;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;position:relative;
  background-image:linear-gradient(140deg,#a8763f,#6d4526);
}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.row-main{flex:1;min-width:0}
.row-title{font-size:15.5px;font-weight:600;margin-bottom:4px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-meta{font-size:12.5px;color:var(--sub);margin-bottom:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-desc{font-size:12.5px;color:var(--sub);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{
  display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--accent-soft);
  color:var(--accent);margin-right:6px;vertical-align:1px;
}
.empty{padding:60px 30px;text-align:center;color:var(--sub);font-size:13.5px;line-height:1.9}

/* ---------- 书架 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px 12px;padding:4px 16px 100px}
.bookcard{display:flex;flex-direction:column;gap:7px;position:relative;cursor:pointer}
.bookcard .cover{width:100%;height:0;padding-bottom:136%;font-size:22px}
.bookcard .cover img{position:absolute;inset:0}
.bookcard .cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,#a8763f,#6d4526);font-size:22px;color:#fff;font-weight:600}
.bc-title{font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.bc-sub{font-size:11px;color:var(--sub);margin-top:-3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 编辑态：封面右上角的选择圈 */
.pick{
  position:absolute;top:5px;right:5px;width:21px;height:21px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.92);background:rgba(0,0,0,.34);
  color:#fff;font-size:13px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background .14s,border-color .14s,transform .14s;
  box-shadow:0 1px 4px rgba(0,0,0,.28);
}
.bookcard.on .pick{background:var(--accent);border-color:var(--accent);transform:scale(1.06)}
.bookcard.on .cover{opacity:.5}
.bookcard.on .cover::after{
  content:'';position:absolute;inset:0;border:2px solid var(--accent);border-radius:8px;
}
/* 编辑态时禁止长按选中文字 / 系统菜单 */
#shelf-list.editing{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bookcard:active .cover{transform:scale(.97)}
.bookcard .cover{transition:transform .12s}

/* 书架底部操作栏（贴在标签栏上方） */
.shelf-bar{
  position:fixed;left:0;right:0;bottom:var(--tab-h,54px);z-index:30;
  display:none;align-items:center;gap:10px;padding:10px 16px;
  background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -4px 16px rgba(0,0,0,.06);
}
.shelf-bar.show{display:flex}
.shelf-bar .sb-c{flex:1;font-size:12.5px;color:var(--sub);text-align:center}
.shelf-bar button{
  padding:9px 15px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface2);font-size:13.5px;color:var(--text);font-family:inherit;
}
.shelf-bar button:active{opacity:.7}
.shelf-bar button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.shelf-bar button:disabled{opacity:.4}

/* ---------- 书源页 ---------- */
.toolbar{display:flex;gap:8px;padding:0 16px 12px;flex:0 0 auto;flex-wrap:wrap}
.tool{
  padding:8px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;display:flex;align-items:center;gap:5px;
}
.tool:active{background:var(--surface2)}
.tool.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.src-item{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  margin:0 12px 8px;display:flex;align-items:center;gap:10px;
}
.src-item.off{opacity:.45}
.src-info{flex:1;min-width:0}
.src-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-url{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.switch{
  width:44px;height:26px;border-radius:13px;background:#d6d1c7;position:relative;flex:0 0 auto;transition:.2s;
}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.small-x{font-size:13px;color:var(--sub);padding:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#d5d0c6;flex:0 0 auto}
.dot.ok{background:#3fa45b}
.dot.bad{background:#d9534f}
.seg{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:3px;margin:0 16px 10px;border:1px solid var(--line);flex:0 0 auto}
.seg button{flex:1;padding:7px;border-radius:8px;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.feed-item{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.feed-item:active{background:var(--surface2)}
.feed-main{flex:1;min-width:0}
.feed-t{font-size:14.5px;line-height:1.45;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed-d{font-size:12px;color:var(--sub);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.feed-thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--surface2)}

/* ---------- 详情页 ---------- */
.detail-top{padding:10px 16px 0;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.back-btn{font-size:26px;line-height:1;color:var(--text);padding:0 6px 4px 0}
.detail-hero{display:flex;gap:14px;padding:8px 18px 14px}
.detail-hero .cover{width:92px;height:126px;font-size:26px;border-radius:10px}
.detail-hero .cover img{position:absolute;inset:0}
.detail-info{flex:1;min-width:0;display:flex;flex-direction:column}
.detail-title{font-size:19px;font-weight:700;line-height:1.3;margin-bottom:6px}
.detail-author{font-size:13px;color:var(--sub);margin-bottom:8px}
.detail-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:auto}
.detail-actions{display:flex;gap:8px;padding:0 18px 14px}
.btn-main{
  flex:1;background:var(--accent);color:#fff;border-radius:12px;padding:12px;font-weight:600;
  font-size:15px;text-align:center;
}
.btn-main:active{opacity:.85}
.btn-ghost{
  flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:12px 16px;font-size:14px;
}
.intro{padding:0 18px 24px;font-size:13.5px;line-height:1.75;color:var(--sub);white-space:pre-wrap}
.sec-title{font-size:13px;font-weight:600;color:var(--sub);padding:6px 18px 8px;letter-spacing:.5px}

/* ---------- 阅读器 ---------- */
.reader{
  position:fixed;inset:0;z-index:50;display:none;flex-direction:column;
  background:var(--rd-bg,#f6f1e6);color:var(--rd-fg,#2b2620);
}
.reader.show{display:flex}
/* 夜间：根节点也铺纯黑。iOS 下拉回弹 / 安全区外露的部分不会闪出浅色，
   状态栏那一行（灵动岛）也就跟正文连成整块 AMOLED 黑。 */
html.rd-night,
html.rd-night body{background:#000000}
/* 纯黑底下抽屉与正文会糊在一起，用一条细线把抽屉的边界交代清楚 */
html.rd-night .reader .sheet{box-shadow:0 -1px 0 #2a2a2a,0 -20px 44px rgba(0,0,0,.9)}
html.rd-night .reader .sheet-mask{background:rgba(0,0,0,.6)}
.rd-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  /* 正文一路铺到屏幕最底部：底部栏是浮层，收起时不留空 */
  padding:calc(var(--safe-t) + 14px) 0 calc(var(--safe-b) + 18px);
}
.rd-inner{max-width:720px;margin:0 auto;padding:0 22px}
.rd-h2{font-size:17px;font-weight:600;margin:8px 0 18px;line-height:1.45;color:var(--rd-fg);
  font-family:var(--rd-font,inherit)}
#rd-content{
  font-size:var(--fs,19px);line-height:var(--lh,1.9);letter-spacing:var(--ls,0);
  font-family:var(--rd-font,-apple-system,"PingFang SC",serif);
}
#rd-content p{margin:0 0 var(--pg,1.05em);text-indent:2em;word-break:break-word}
#rd-content p:empty{display:none}
#rd-content img{max-width:100%;height:auto;border-radius:6px;display:block;margin:12px auto}
#rd-content h3,#rd-content h4{text-indent:0;margin:1em 0 .6em;font-size:1.02em}
.rd-end{text-align:center;color:var(--sub);font-size:12.5px;padding:26px 0 10px;text-indent:0!important}
.rd-nav{display:flex;gap:10px;margin-top:20px}
.rd-nav button{
  flex:1;padding:12px;border-radius:10px;border:1px solid var(--rd-line,#ddd5c4);
  font-size:14px;color:var(--rd-fg);
}
.rd-nav button:disabled{opacity:.35}

/* ---------- 左右翻页 ----------
   正文用 CSS 多栏横向排开，一栏就是一页，靠 translateX 整页平移。
   栏宽 = 容器宽 − 2×内边距，栏间距 = 2×内边距，所以第 i 页的起点正好落在 i×容器宽，
   平移量直接就是 page × 容器宽，不用另算累积偏移。 */
.rd-body[data-paging="slide"]{overflow:hidden;touch-action:pan-y}
.rd-body[data-paging="slide"] .rd-inner{
  max-width:none;margin:0;column-fill:auto;
  will-change:transform;
  transition:transform .26s cubic-bezier(.22,.61,.36,1);
}
.rd-body[data-paging="slide"] .rd-inner.dragging{transition:none}

.rd-bar{
  position:fixed;left:0;right:0;z-index:52;background:var(--rd-panel,#fffdf8);
  border-color:var(--rd-line,#e5ded0);transition:transform .25s ease,opacity .25s ease;
}
.rd-top{
  top:0;padding:calc(var(--safe-t) + 8px) 12px 8px;border-bottom:1px solid var(--rd-line,#e5ded0);
  display:flex;align-items:center;gap:8px;
}
.rd-top .t{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.rd-top button{padding:6px 4px;font-size:14px;color:var(--rd-fg)}
/* 「加入书架」：未加入是空心星，加入后实心并染成强调色 */
#rd-fav{font-size:13px;white-space:nowrap;opacity:.8}
#rd-fav.on{color:var(--accent);opacity:1}
#rd-full{display:flex;align-items:center;justify-content:center}
/* 新手提示卡 */
.rd-tips{
  position:fixed;left:14px;right:14px;top:calc(var(--safe-t) + 60px);z-index:56;
  background:var(--rd-panel);color:var(--rd-fg);border:1px solid var(--rd-line,#e5ded0);
  border-radius:14px;padding:14px 16px 12px;box-shadow:0 12px 34px rgba(0,0,0,.2);
  font-size:13.5px;line-height:1.7;
}
.rd-tips[hidden]{display:none}
.rd-tips-hd{font-weight:600;font-size:14px;margin-bottom:8px}
.rd-tip{display:flex;gap:8px;margin-bottom:6px}
.rd-tip .n{
  flex:0 0 18px;height:18px;line-height:18px;text-align:center;border-radius:9px;
  background:var(--accent);color:#fff;font-size:11px;margin-top:4px;
}
#rd-tips-ok{width:100%;margin-top:6px;padding:9px;border-radius:10px;border:1px solid var(--rd-line,#e5ded0);font-size:13.5px;color:var(--rd-fg)}
.rd-bottom{
  bottom:0;padding:10px 16px calc(var(--safe-b) + 10px);border-top:1px solid var(--rd-line,#e5ded0);
}
.rd-progress{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin-bottom:10px}
.rd-track{flex:1;height:3px;border-radius:2px;background:var(--rd-line,#e5ded0);overflow:hidden}
.rd-fill{height:100%;background:var(--accent);width:0;border-radius:2px}
.rd-ctrl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.rd-ctrl .g{display:flex;gap:6px;flex:1;justify-content:center}
.rd-ctrl button{
  padding:9px 14px;border-radius:10px;font-size:13.5px;color:var(--rd-fg);
  border:1px solid var(--rd-line,#e5ded0);
}
.rd-ctrl button:disabled{opacity:.3}
/* 底部第三行：目录 / 昼夜 / 设置（目录放最左，跟大拇指的位置一致） */
.rd-acts{
  display:flex;gap:8px;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--rd-line,#e5ded0);
}
.rd-acts button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;border-radius:10px;font-size:11.5px;line-height:1.2;
  color:var(--rd-fg);border:1px solid transparent;
}
.rd-acts button:active{background:rgba(128,128,128,.12)}
.rd-acts button span{font-size:17px;line-height:1;opacity:.85}
.rd-acts button b{font-weight:400}
/* 亮度遮罩：压暗正文但不动控件 */
.rd-dim{
  position:fixed;inset:0;z-index:51;background:#000;opacity:0;
  pointer-events:none;transition:opacity .18s ease;
}
.hidden-bar{transform:translateY(-105%);opacity:0;pointer-events:none}
.rd-bottom.hidden-bar{transform:translateY(105%)}

/* 设置面板 & 目录抽屉 */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);
  border-radius:18px 18px 0 0;padding:6px 0 calc(var(--safe-b) + 8px);
  transform:translateY(105%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:74vh;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.14);
}
.sheet.show{transform:translateY(0)}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;opacity:0;
  pointer-events:none;transition:opacity .25s}
.sheet-mask.show{opacity:1;pointer-events:auto}
/* 阅读器内的面板跟随阅读主题 */
.reader .sheet{background:var(--rd-panel,#fffdf8);color:var(--rd-fg,#2b2620)}
.reader .sheet-hd{border-bottom-color:var(--rd-line,#e5ded0)}
.reader .chip{background:transparent;border-color:var(--rd-line,#e5ded0);color:var(--rd-fg,#2b2620)}
.reader .chip.on{border-color:var(--accent);color:var(--accent)}
.reader .toc-item{border-bottom-color:var(--rd-line,#e5ded0)}
.sheet-hd{display:flex;align-items:center;padding:12px 18px 10px;border-bottom:1px solid var(--line)}
.sheet-hd .st{font-size:15px;font-weight:600;flex:1}
.sheet-hd .x{font-size:20px;color:var(--sub);padding:0 4px}
.sheet-body{overflow-y:auto;padding:14px 18px 8px}
.set-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.set-label{font-size:13px;color:var(--sub);width:52px;flex:0 0 auto}
.set-ctl{flex:1;display:flex;align-items:center;gap:8px}
input[type=range]{flex:1;accent-color:var(--accent);height:22px}
.set-val{font-size:12px;color:var(--sub);width:34px;text-align:right}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;background:var(--surface2)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.build-stamp{margin:4px 0 2px;font-size:11px;line-height:1.5;color:var(--sub);text-align:center;letter-spacing:.2px}

.toc-list{padding:0 0 20px}
.toc-item{padding:13px 18px;font-size:14px;border-bottom:1px solid var(--line);
  display:flex;gap:8px;align-items:center}

<script>
/* PWA：让「添加到主屏幕」后真全屏（没有地址栏）。
   start_url 必须带上当前查询串（访问口令在参数里，丢了会被拒），
   所以清单在这里按 location 动态拼，而不是写死在 manifest.json 里。
   paintManifest(bg) 还能让启动底色跟着阅读主题走（夜间启动不闪米黄）。 */
window.paintManifest = function(bgColor){
  try{
    const abs = p => new URL(p, location.href).href;
    const bg = bgColor || '#f6f4ef';
    const m = {
      name: '书源阅读', short_name: '书源阅读', lang: 'zh-CN',
      start_url: location.pathname + location.search,
      scope: location.pathname.replace(/[^/]*$/, ''),
      display: 'standalone', orientation: 'portrait',
      background_color: bg, theme_color: bg,
      icons: [
        { src: abs('icon-192.png'), sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: abs('icon-512.png'), sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: abs('icon-512.png'), sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    let link = document.querySelector('link[rel="manifest"]');
    if(!link){
      link = document.createElement('link');
      link.rel = 'manifest';
      document.head.appendChild(link);
    }
    link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m));
  }catch(e){ /* 不支持就算了，不影响阅读 */ }
};
window.paintManifest();
</script>

<script>
/* =========================================================
   0. 基础工具
   ========================================================= */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer = null;
function toast(msg, ms = 1800){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

/* 常驻提示：用于下载这类耗时操作。
   toast 默认 1.8 秒就消失，长任务期间用户什么都看不到，看起来就像「点了没反应」。 */
function toastSticky(msg){
  const el = $('#toast');
  clearTimeout(toastTimer);
  el.textContent = msg;
  el.classList.add('show');
  return {
    update(m){ el.textContent = m; el.classList.add('show'); },
    done(m, ms = 2400){
      clearTimeout(toastTimer);
      el.textContent = m;
      el.classList.add('show');
      toastTimer = setTimeout(() => el.classList.remove('show'), ms);
    }
  };
}

/* =========================================================
   1. 存储（IndexedDB，localStorage 兜底）
   ========================================================= */
const DB = (() => {
  let dbp = null;
  function open(){
    if(!dbp) dbp = new Promise((res, rej) => {
      if(!window.indexedDB) return rej(new Error('no idb'));
      const r = indexedDB.open('legado_web_v1', 1);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function get(k){
    try{
      const db = await open();
      return await new Promise((res, rej) => {
        const rq = db.transaction('kv','readonly').objectStore('kv').get(k);
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      });
    }catch(e){
      try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : undefined; }catch(_){ return undefined; }
    }
  }
  let lastError = null;
  async function set(k, v){
    try{
      const db = await open();
      await new Promise((res, rej) => {
        const rq = db.transaction('kv','readwrite').objectStore('kv').put(v, k);
        rq.onsuccess = () => res();
        rq.onerror = () => rej(rq.error);
      });
      return true;
    }catch(e){
      try{
        localStorage.setItem(k, JSON.stringify(v));
        return true;
      }catch(e2){
        // 以前这里把错误吞掉，用户看到「导入成功」但刷新后全没了
        lastError = new Error(
          (e2 && e2.name === 'QuotaExceededError')
            ? '浏览器存储满了（配额不足）'
            : ('存储写入失败：' + ((e2 && e2.message) || e2 || e))
        );
        return false;
      }
    }
  }
  return { get, set, lastError: () => lastError };
})();

/* =========================================================
   1b. 书架跨设备同步
   ---------------------------------------------------------
   书架默认存在本机 IndexedDB 里，所以「手机加的书电脑看不到」。
   部署在带后端的版本上时，额外把书架存服务端一份：
     · 打开页面 / 切回前台 → 拉一次，按 id 合并（并集，进度取更新的）
     · 每次改动 → 推一次；删除带墓碑，避免被另一台设备推回来
     · 推上去的条目不含目录，换设备点开时再拉（目录动辄上千章，太重）
   纯前端模式（没有后端）下这些函数什么也不做，行为与从前一致。
   ========================================================= */
const SHELF_SYNC = { on:false, busy:false, at:0, lastErr:'' };

/* 瘦身版：目录不进同步，其余字段够另一台设备把书打开 */
function shelfOut(){
  return S.shelf.map(b => ({
    id: b.id, name: b.name, author: b.author || '', coverUrl: b.coverUrl || '',
    bookUrl: b.bookUrl || '', sourceUrl: b.sourceUrl || '', tocUrl: b.tocUrl || '',
    idx: b.idx || 0, scroll: b.scroll || 0,
    addedAt: b.addedAt || 0, updatedAt: b.updatedAt || 0
  }));
}

function mergeShelf(remote){
  const byId = new Map(S.shelf.map(b => [b.id, b]));
  let hit = 0;
  for(const r of remote || []){
    if(!r || !r.id) continue;
    const local = byId.get(r.id);
    if(!local){
      byId.set(r.id, Object.assign({ toc: [] }, r));   // 目录等点开时再拉
      hit++;
    }else if(Number(r.updatedAt || 0) > Number(local.updatedAt || 0)){
      local.idx = r.idx != null ? r.idx : local.idx;
      local.scroll = r.scroll != null ? r.scroll : local.scroll;
      local.updatedAt = r.updatedAt;
      if(r.name) local.name = r.name;
      if(r.coverUrl) local.coverUrl = r.coverUrl;
      if(r.tocUrl) local.tocUrl = r.tocUrl;
      hit++;
    }
  }
  if(!hit) return 0;
  S.shelf = [...byId.values()].sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
  DB.set(KEY.SHELF, S.shelf);
  renderShelf();
  return hit;
}

async function syncPull(){
  if(!SHELF_SYNC.on || SHELF_SYNC.busy) return 0;
  SHELF_SYNC.busy = true;
  try{
    const r = await fetch(BE._url('/api/state'), { cache:'no-store' });
    if(!r.ok) return 0;
    const d = await r.json();
    const gone = new Set(d.removed || []);
    if(gone.size){
      const before = S.shelf.length;
      S.shelf = S.shelf.filter(b => !gone.has(b.id));
      if(S.shelf.length !== before){ DB.set(KEY.SHELF, S.shelf); renderShelf(); }
    }
    SHELF_SYNC.at = Date.now();
    return mergeShelf(d.shelf);
  }catch(e){ SHELF_SYNC.lastErr = e.message || String(e); return 0; }
  finally { SHELF_SYNC.busy = false; }
}

async function syncPush(removed){
  if(!SHELF_SYNC.on) return;
  try{

/* =========================================================
   1c. 书源跨入口同步
   ---------------------------------------------------------
   iOS「添加到主屏幕」之后，PWA 用的是独立存储容器，和 Safari 标签页的
   IndexedDB 不互通。所以会出现「书架里有书，点开却说没有书源」——
   书架早就走云端了，书源只存在本地，一换入口就是空的。
   这里把书源也推到服务端，新入口进来先拉一份。
   ========================================================= */
const SRC_SYNC = { busy:false };

async function syncSourcesPush(){
  if(!BE.ok) return;
  try{ await BE.post('/api/sources', { sources: S.sources }, 60000); }
  catch(e){ /* 推失败不影响本地使用，下次保存再试 */ }
}

/* 返回补进来的条数。本地没有就整份接管；本地已有就只补服务端独有的，
   不覆盖本地改动（否则在手机上删掉的源会被电脑那份推回来）。 */
async function syncSourcesPull(){
  if(!BE.ok || SRC_SYNC.busy) return 0;
  SRC_SYNC.busy = true;
  try{
    const r = await fetch(BE._url('/api/sources'), { cache:'no-store' });
    if(!r.ok) return 0;
    const d = await r.json();
    const remote = Array.isArray(d.sources) ? d.sources : [];
    if(!remote.length){
      // 服务端还是空的：把本地这份推上去，作为第一次补种。
      // 少了这一步，老用户升级后服务端会一直是空的，主屏 PWA 那边照样拿不到源，
      // 还得手动再导入一遍——那就白改了。
      if(S.sources.length){ syncSourcesPush(); return S.sources.length; }
      return 0;
    }

    if(!S.sources.length){
      S.sources = remote.map(normalizeSource).filter(Boolean);
      await DB.set(KEY.SRC, S.sources);
      return S.sources.length;
    }
    const have = new Set(S.sources.map(s => s.bookSourceUrl));
    const extra = remote.filter(s => s && s.bookSourceUrl && !have.has(s.bookSourceUrl));
    if(!extra.length) return 0;
    S.sources = S.sources.concat(extra.map(normalizeSource).filter(Boolean));
    await DB.set(KEY.SRC, S.sources);
    return extra.length;
  }catch(e){ return 0; }
  finally { SRC_SYNC.busy = false; }
}

function proxyList(){
  if(!S.settings.proxies || !S.settings.proxies.length){
    S.settings.proxies = BUILTIN_PROXIES.map(p => ({ ...p, enabled: true }));
  }
  return S.settings.proxies.filter(p => p.enabled);
}

function buildProxyUrl(tpl, url){
  if(tpl === '{url}') return url;
  return tpl.replace('{url}', url).replace('{enc}', encodeURIComponent(url));
}

function fetchT(url, timeout = 14000, headers){
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), timeout);
  return fetch(url, {
    signal: c.signal,
    headers: headers || {},
    redirect: 'follow',
    mode: 'cors',
    credentials: 'omit',
    cache: 'no-store'
  }).finally(() => clearTimeout(t));
}

function decodeBuf(buf, ct){
  let cs = ((ct || '').match(/charset\s*=\s*["']?([\w-]+)/i) || [])[1];
  if(!cs){
    const head = new TextDecoder('utf-8').decode(buf.slice(0, 4000));
    cs = (head.match(/charset\s*=\s*["']?([\w-]+)/i) || [])[1];
  }
  cs = (cs || 'utf-8').toLowerCase().replace(/["']/g, '');
  if(cs === 'gb2312' || cs === 'gbk' || cs === 'gb18030') cs = 'gbk';
  if(cs === 'big5') cs = 'big5';
  try{ return new TextDecoder(cs).decode(buf); }
  catch(e){ return new TextDecoder('utf-8').decode(buf); }
}

/* 逐代理尝试，返回 {text, json, url} */
const deadCount = {};
function resetNet(){ for(const k in deadCount) delete deadCount[k]; }

async function fetchText(url, opt = {}){
  const list = proxyList();
  if(!list.length) throw new Error('没有可用的代理，请到「书源 - 代理」里开启');

  const picked = S.settings.lastProxy;
  const order = [...list].sort((a, b) => (b.tpl === picked ? 1 : 0) - (a.tpl === picked ? 1 : 0));

  let lastErr = null;
  for(const p of order){
    if((deadCount[p.tpl] || 0) >= 3) continue;
    const target = buildProxyUrl(p.tpl, url);
    try{
      const r = await fetchT(target, opt.timeout || 12000);
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const buf = await r.arrayBuffer();
      if(buf.byteLength < 4) throw new Error('空响应');

      const ct = r.headers.get('content-type') || '';
      const text = decodeBuf(buf, ct);
      const head = text.slice(0, 200).toLowerCase();
      if(text.length < 900 && /(429|too many requests|rate limit|forbidden|access denied|blocked)/.test(head)){
        throw new Error('代理被限流');
      }
      if(p.tpl !== '{url}' && /^\s*\{\s*"contents"/.test(text)) throw new Error('代理返回格式异常');

      deadCount[p.tpl] = 0;
      S.settings.lastProxy = p.tpl;
      let json = null;
      const st = text.trim();
      if(st.startsWith('{') || st.startsWith('[')){ try{ json = JSON.parse(st); }catch(e){} }
      return { text, json, url };
    }catch(e){
      lastErr = e;
      deadCount[p.tpl] = (deadCount[p.tpl] || 0) + 1;
    }
  }
  throw new Error(lastErr ? '代理失败：' + lastErr.message : '所有代理都不可用，去「代理」里测一下');
}

/* 图片走代理 */
function imgSrc(u){
  if(!u) return '';
  if(/^(data:|blob:)/i.test(u)) return u;

  if(BE.ok) return BE.imgUrl(u);
  const list = proxyList();
  const cand = list.find(x => x.tpl === S.settings.lastProxy && x.tpl !== '{url}')
            || list.find(x => x.tpl !== '{url}');
  if(!cand) return u;
  return buildProxyUrl(cand.tpl, u);
}

/* =========================================================
   3. 规则引擎（Legado 语法子集）
   ========================================================= */
const Rule = (() => {

  function mkDoc(html){
    return new DOMParser().parseFromString(html || '', 'text/html');
  }

  /* --- JSONPath 迷你实现 --- */
  function jp(data, expr){
    let p = String(expr).trim();
    if(p.startsWith('$')) p = p.slice(1);
    const toks = p.match(/\.\.[\w\u4e00-\u9fa5$-]+|\.[\w\u4e00-\u9fa5$-]+|\[\d+\]|\[\*\]|\[['"][^'"]+['"]\]/g) || [];
    let cur = [data];
    for(const tk of toks){
      const next = [];
      for(const c of cur){
        if(c == null) continue;
        if(tk.startsWith('..')){
          const key = tk.slice(2);
          (function deep(o){
            if(!o || typeof o !== 'object') return;
            if(Array.isArray(o)){ o.forEach(deep); return; }
            for(const k in o){
              if(k === key) next.push(o[k]);
              deep(o[k]);
            }
          })(c);
        }else if(tk.startsWith('.')){
          const key = tk.slice(1);
          if(Array.isArray(c)){ c.forEach(x => { if(x && typeof x === 'object' && key in x) next.push(x[key]); }); }
          else if(typeof c === 'object' && key in c) next.push(c[key]);
        }else if(tk === '[*]'){
          if(Array.isArray(c)) next.push(...c);
          else if(c && typeof c === 'object') next.push(...Object.values(c));
        }else{
          let m = tk.match(/\[(\d+)\]/);
          if(m){ if(c) next.push(c[+m[1]]); continue; }
          m = tk.match(/\[['"]([^'"]+)['"]\]/);
          if(m && c) next.push(c[m[1]]);
        }
      }
      cur = next;
    }
    return cur;
  }

  /* --- 选择器转换 --- */
  const CLASS_XP = n => `*[contains(concat(" ",normalize-space(@class)," ")," ${n} ")]`;

  /* Legado 里 "class.dir clear" 表示同时有两个 class */
  function pre(sel){
    let s = sel;
    for(let i = 0; i < 4; i++){
      const n = s.replace(/class\.([\w-]+)\s+([\w-]+)(?=\s|@|>|$)/g, 'class.$1.$2');
      if(n === s) return s;
      s = n;
    }
    return s;
  }

  function toXPath(sel0){
    const sel = pre(sel0);
    const segs = sel.split(/\s*[@>]\s*|\s+/).filter(Boolean);
    if(!segs.length) return null;
    const steps = segs.map(s => {
      if(s.startsWith('class.')){
        const cs = s.slice(6).split('.');
        return '*' + cs.map(c => `[contains(concat(" ",normalize-space(@class)," ")," ${c} ")]`).join('');
      }
      if(s.startsWith('id.'))   return `*[@id="${s.slice(3)}"]`;
      if(s.startsWith('tag.'))  return s.slice(4);
      if(s.startsWith('text.')) return `*[contains(normalize-space(.),"${s.slice(5)}")]`;
      return s;
    });
    return '//' + steps.join('//');
  }

  function toCss(sel0){
    const sel = pre(sel0);
    const segs = sel.split(/\s*[@>]\s*|\s+/).filter(Boolean);
    const out = [];
    for(const s of segs){
      // Legado 的索引写法：tag.a.0 / class.item.1 / p.2（取第 N 个）
      const im = s.match(/^(tag|class|id)\.(.+)\.(\d+)$/);
      if(im){
        const base = im[1] === 'tag' ? im[2] : im[1] === 'class' ? '.' + im[2] : '#' + im[2];
        out.push(`${base}:nth-of-type(${Number(im[3]) + 1})`);
        continue;
      }
      const tm = s.match(/^([a-zA-Z][\w-]*)\.(\d+)$/);
      if(tm){
        out.push(`${tm[1]}:nth-of-type(${Number(tm[2]) + 1})`);
        continue;
      }
      if(s.startsWith('class.')){
        out.push(s.slice(6).split('.').map(c => '.' + c).join(''));
      }else if(s.startsWith('id.')){
        out.push('#' + s.slice(3));
      }else if(s.startsWith('tag.')){
        out.push(s.slice(4));
      }else{
        out.push(s);
      }
    }
    return out.join(' ');
  }

  /* XPath 求值 */
  function xpath(doc, ctxNode, expr){
    const root = ctxNode || doc;
    try{
      const r = doc.evaluate(expr, root, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null);
      const arr = [];
      for(let i = 0; i < r.snapshotLength; i++){
        const n = r.snapshotItem(i);
        if(n.nodeType === 3 || n.nodeType === 4) arr.push({ __text: n.nodeValue });
        else arr.push(n);
      }
      return arr;
    }catch(e){ return []; }
  }

  /* 从元素取值 */
  function val(el, attr, baseUrl){
    if(el == null) return '';
    if(el.__text != null) return String(el.__text).trim();
    // 普通 JSON 对象
    if(typeof el !== 'object' || !el.nodeType){
      if(attr && el && typeof el === 'object') return String(el[attr] ?? '');
      return typeof el === 'object' ? JSON.stringify(el) : String(el);
    }
    if(!attr || attr === 'text' || attr === 'ownText'){
      const t = el.textContent || '';
      return t.replace(/\u00a0/g, ' ').replace(/[ \t\r\n]+/g, ' ').trim();
    }
    if(attr === 'html' || attr === 'all') return el.innerHTML || '';
    if(attr === 'outerHtml') return el.outerHTML || '';
    if(attr === 'textNodes'){
      return [...el.childNodes].filter(n => n.nodeType === 3).map(n => n.nodeValue).join('').trim();
    }
    let v = el.getAttribute ? el.getAttribute(attr) : null;
    if(v == null && /^(src|href)$/i.test(attr)){
      v = el.getAttribute('data-src') || el.getAttribute('data-original') ||
          el.getAttribute('data-echo') || el.getAttribute('data-url') ||
          el.getAttribute('data-lazy-src') || el.getAttribute('src');
    }
    if(v == null) return '';
    return String(v).trim();
  }

  /* ## 正则替换 */
  function applyRepl(str, repl){
    let r = String(repl || '');
    let flags = 'g';
    if(r.endsWith('###')){ r = r.slice(0, -3); }
    const i = r.indexOf('##');
    const pat = i >= 0 ? r.slice(0, i) : r;
    const rep = i >= 0 ? r.slice(i + 2) : '';
    if(!pat) return str;
    try{ return String(str).replace(new RegExp(pat, flags), rep); }
    catch(e){
      try{ return String(str).replace(new RegExp(pat), rep); }
      catch(_){ return str; }
    }
  }

  /* 拆分顶层 || */
  function splitTop(s, sep){
    const out = [];
    let cur = '';
    for(let i = 0; i < s.length; i++){
      if(s[i] === sep[0] && s[i + 1] === sep[1]){
        out.push(cur); cur = ''; i++;
      }else cur += s[i];
    }
    out.push(cur);
    return out;
  }

  /* 单条规则求值：返回 Element[] 或 string[] */
  function one(raw, ctx){
    raw = String(raw).trim();
    if(!raw) return null;
    if(/@js:|<js>/i.test(raw)) return null;

    let sel = raw, repl = null;
    const hi = raw.indexOf('##');
    if(hi > 0){ sel = raw.slice(0, hi); repl = raw.slice(hi + 2); }

    /* 整条规则就是一个属性名：@href / @text（作用于当前节点） */
    const pure = sel.trim().match(/^@([a-zA-Z][\w-]*)$/);
    if(pure){
      const ns = ctx.node ? [ctx.node] : [];
      const vs = ns.map(n => val(n, pure[1], ctx.baseUrl)).filter(v => v !== '');
      return vs.length ? vs.map(s => repl ? applyRepl(s, repl) : s) : null;
    }

    let kind = 'css', body = sel.trim(), rawCss = false;
    if(/^@css:/i.test(body)){ kind = 'css'; body = body.slice(5).trim(); rawCss = true; }
    else if(body.startsWith('@@')){ kind = 'css'; body = body.slice(2).trim(); rawCss = true; }
    else if(/^@xpath:/i.test(body)){ kind = 'xpath'; body = body.slice(7).trim(); }
    else if(/^@json:/i.test(body)){ kind = 'json'; body = body.slice(6).trim(); }
    else if(/^@/.test(body)){ return null; }
    else if(body.startsWith('/') || body.startsWith('./')){ kind = 'xpath'; }
    else if(body.startsWith('$')){ kind = 'json'; }
    else if(body.startsWith(':')){ kind = 'regex'; body = body.slice(1); }

    /* --- JSON --- */
    if(kind === 'json'){
      let data;
      // 已经定位到某个 JSON 节点时，从该节点往下取值
      if(ctx.node && typeof ctx.node === 'object' && !ctx.node.nodeType) data = ctx.node;
      else data = ctx.json;
      if(data == null){
        try{ data = JSON.parse(ctx.html); }catch(e){ return null; }
      }
      const arr = jp(data, body);
      if(!arr.length) return null;
      return arr.map(x => {
        if(x == null) return '';
        if(typeof x === 'object') return x;
        const s = String(x);
        return repl ? applyRepl(s, repl) : s;
      });
    }

    /* --- 正则（整页） --- */
    if(kind === 'regex'){
      const m = String(ctx.html || '').match(new RegExp(body, 's'));
      if(!m) return null;
      const out = [m[1] != null ? m[1] : m[0]];
      return out.map(s => repl ? applyRepl(s, repl) : s);
    }

    /* 属性标记：支持 "sel@attr" 和 "sel > text/html" 两种写法 */
    // @ 既可能是"取属性"（a@href），也可能是"再选一层"（.dir@li）。
    // 只有落在已知属性名里的才当属性，否则按层级处理。
    const ATTRS = /^(text|textNodes|html|all|ownText|outerHtml|innerHtml|href|src|title|alt|content|value|class|style|id|datetime|data-[\w-]+)$/i;
    let attr = null;
    const gt = body.match(/^(.*?)\s*>\s*(text|html|ownText|outerHtml|all)$/i);
    if(gt && gt[1].trim()){ body = gt[1].trim(); attr = gt[2]; }
    else{
      const am = body.match(/^([\s\S]+?)@([a-zA-Z][\w-]*)$/);
      if(am && am[1].trim()){
        if(ATTRS.test(am[2])){ body = am[1].trim(); attr = am[2]; }
        else{ body = am[1].trim() + ' > ' + am[2]; }
      }
    }
    /* 只写属性名（chapterName: "text" / chapterUrl: "href"） */
    if(!attr && ctx.node && /^(text|html|ownText|outerHtml|all|href|src|title|alt|content|value|data-src|data-original)$/i.test(body)){
      attr = body; body = '';
    }

    let nodes = [];

    if(!body){
      nodes = ctx.node ? [ctx.node] : (ctx.doc ? [ctx.doc.documentElement] : []);
    }
    /* --- XPath --- */
    else if(kind === 'xpath'){
      nodes = xpath(ctx.doc, ctx.node, body);
    }
    /* --- CSS --- */
    else {
      const base = ctx.node || ctx.doc;
      let css = rawCss ? body : toCss(body);
      // :contains() 是 jQuery 扩展，标准 CSS 不认，拆出来手动过滤
      let needText = null;
      const cm = css.match(/:contains\((["']?)([\s\S]*?)\1\)/);
      if(cm){ needText = cm[2]; css = css.replace(cm[0], '').trim(); }

      if(/\btext\./.test(body) && !rawCss){
        const xp = toXPath(body);
        if(xp) nodes = xpath(ctx.doc, ctx.node, xp);
      }
      if(!nodes.length && base.querySelectorAll && css){
        try{
          nodes = [...base.querySelectorAll(css)];
          if(needText) nodes = nodes.filter(n => (n.textContent || '').includes(needText));
        }catch(e){
          const xp = toXPath(body);
          if(xp) nodes = xpath(ctx.doc, ctx.node, xp);
        }
      }
    }

    if(!nodes || !nodes.length){
      // 有些源的列表项本身就是 <a>，规则却写 tag.a@href，退回取自身属性
      if(attr && ctx.node && ctx.node.getAttribute){
        const v = val(ctx.node, attr, ctx.baseUrl);
        if(v) return [repl ? applyRepl(v, repl) : v];
      }
      return null;
    }

    if(attr){
      const out = nodes.map(n => val(n, attr, ctx.baseUrl)).filter(v => v !== '' && v != null);
      return out.length ? out.map(s => repl ? applyRepl(s, repl) : s) : null;
    }
    return nodes;
  }

  /* 对外：返回字符串（多值取第一个） */
  function str(rule, ctx){
    if(rule == null) return '';
    const s = String(rule).trim();
    if(!s) return '';
    for(const branch of splitTop(s, '||')){
      const v = one(branch, ctx);
      if(v == null) continue;
      if(Array.isArray(v)){
        if(!v.length) continue;
        const first = v[0];
        let r = '';
        if(typeof first === 'string') r = first;
        else if(first && first.nodeType) r = val(first, 'text', ctx.baseUrl);
        else if(first && first.__text != null) r = String(first.__text);
        else if(first && typeof first === 'object') r = JSON.stringify(first);
        if(r) return r;
      }
    }
    return '';
  }

  /* 对外：返回元素数组 */
  function list(rule, ctx){
    if(!rule) return [];
    const s = String(rule).trim();
    for(const branch of splitTop(s, '||')){
      const v = one(branch, ctx);
      if(Array.isArray(v) && v.length){
        // 纯字符串结果当成伪元素
        if(typeof v[0] === 'string'){
          return v.map(t => ({ __text: t, nodeType: 1, getAttribute: () => null, querySelectorAll: () => [] }));
        }
        return v.filter(x => x && typeof x === 'object');
      }
    }
    return [];
  }

  /* 提取 URL 类规则（支持 {{...}} 组合） */
  function url(rule, ctx){
    if(!rule) return '';
    let s = String(rule).trim();
    // 纯 JS 规则算不出地址，返回空让调用方兜底
    if(/^<js>[\s\S]*<\/js>$/i.test(s) || /^@js:/i.test(s)) return '';

    if(s.includes('{{')){
      s = s.replace(/\{\{([\s\S]*?)\}\}/g, (m, inner) => {
        inner = inner.trim();
        if(/^@js:|java\./i.test(inner)) return '';
        const v = str(inner, ctx);
        return v || '';
      });
    }else{
      s = str(s, ctx);
    }
    return abs(s, ctx.baseUrl);
  }

  function abs(u, base){
    if(!u) return '';
    u = String(u).trim();
    if(/^(https?:|data:|blob:)/i.test(u)) return u;
    if(u.startsWith('//')) return 'https:' + u;
    try{ return new URL(u, base || location.href).href; }
    catch(e){ return u; }
  }

  return { mkDoc, str, list, url, abs, jp, xpath, val };
})();

/* =========================================================
   4. 书源数据模型
   ========================================================= */
function normalizeSource(raw){
  if(!raw || typeof raw !== 'object') return null;
  const s = { ...raw };
  // 部分源把 rule* 存成字符串
  for(const k of ['ruleSearch','ruleExplore','ruleBookInfo','ruleToc','ruleContent']){
    if(typeof s[k] === 'string'){
      try{ s[k] = JSON.parse(s[k]); }catch(e){ s[k] = {}; }
    }
    if(!s[k] || typeof s[k] !== 'object') s[k] = {};
  }
  if(!s.bookSourceUrl && !s.bookSourceName) return null;
  s.bookSourceUrl = (s.bookSourceUrl || '').trim();
  s.bookSourceName = (s.bookSourceName || s.bookSourceUrl || '未命名').trim();
  if(s.enabled === undefined) s.enabled = true;
  if(s.bookSourceType == null) s.bookSourceType = 0;
  // 兼容旧字段名
  if(!s.ruleBookInfo.tocUrl && s.ruleBookInfo.chapterList) s.ruleBookInfo.tocUrl = '';
  return s;
}

function parseSourceJSON(txt){
  const arr = looseParse(txt);
  const out = [];
  for(const x of arr){
    const n = normalizeSource(x);
    if(n) out.push(n);
  }
  if(!out.length) throw new Error('解析到 0 个有效书源');
  return out;
}

function looseParse(txt){
  let data;
  try{ data = JSON.parse(txt); }
  catch(e){
    const a = txt.indexOf('['), b = txt.lastIndexOf(']');
    const c = txt.indexOf('{'), d = txt.lastIndexOf('}');
    if(a >= 0 && b > a && (c < 0 || a < c)) data = JSON.parse(txt.slice(a, b + 1));
    else if(c >= 0 && d > c) data = JSON.parse(txt.slice(c, d + 1));
    else throw new Error('不是合法的 JSON');
  }
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.bookSources)) return data.bookSources;
  if(data && Array.isArray(data.sources)) return data.sources;
  if(data && Array.isArray(data.data)) return data.data;
  if(data && (data.bookSourceUrl || data.sourceUrl)) return [data];
  throw new Error('没找到书源或订阅源数组');
}

/* 订阅源（Legado RSS source） */
function normalizeRss(raw){
  if(!raw || typeof raw !== 'object' || !raw.sourceUrl) return null;
  const s = { ...raw };
  s.sourceUrl = String(s.sourceUrl).trim();
  s.sourceName = String(s.sourceName || s.sourceUrl).trim();
  if(s.enabled === undefined) s.enabled = true;
  return s;
}

/* 有些源的关键规则依赖 JS 引擎，浏览器里跑不了，提前识别。
   正文规则用 JS 不算致命——抓不到就用通用正文提取兜底。 */
function criticalJs(src){
  const r = src.ruleSearch || {}, t = src.ruleToc || {}, bi = src.ruleBookInfo || {};
  const keys = [src.searchUrl, r.bookList, r.name, r.bookUrl,
                bi.tocUrl, t.chapterList, t.chapterName, t.chapterUrl];
  return keys.some(v => typeof v === 'string' && /@js:|<js>|java\.|@put:|@get:/.test(v));
}

/* =========================================================
   5. 业务逻辑
   ========================================================= */
/* 给书源 JS 用的 java.* 兼容层（同步、无副作用的那些） */
const JavaStub = (() => {
  const mem = {};
  return {
    encodeURI: (s, cs) => encodeURIComponent(String(s ?? '')),
    encodeURIComponent: s => encodeURIComponent(String(s ?? '')),
    base64Encode: s => {
      try{ return btoa(unescape(encodeURIComponent(String(s ?? '')))); }catch(e){ return ''; }
    },
    base64Decode: s => {
      try{ return decodeURIComponent(escape(atob(String(s ?? '')))); }catch(e){ return ''; }
    },
    hexDecodeToString: s => {
      try{
        const h = String(s ?? '').replace(/[^0-9a-f]/gi, '');
        let out = '';
        for(let i = 0; i < h.length; i += 2) out += String.fromCharCode(parseInt(h.substr(i, 2), 16));
        return decodeURIComponent(escape(out));
      }catch(e){ return ''; }
    },
    hexEncodeToString: s => {
      return [...String(s ?? '')].map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
    },
    timeFormat: t => {
      const d = new Date(Number(t) || Date.now());
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    },
    put: (k, v) => { mem[k] = v; },
    get: k => mem[k] ?? '',
    log: (...a) => console.log('[源]', ...a),
    toast: () => {},
  };
})();

function buildSearchUrl(tpl, key, page){
  let u = tpl.replace(/\{\{([\s\S]*?)\}\}/g, (m, e) => {
    e = e.trim();
    if(e === 'key' || e === 'keyword') return encodeURIComponent(key);
    if(e === 'page') return String(page);
    try{
      const fn = new Function('page','key','keyword','encodeURIComponent','base64','java',
        'return (' + e + ')');
      const r = fn(page, key, key, encodeURIComponent,
        s => btoa(unescape(encodeURIComponent(s))), JavaStub);
      return r == null ? '' : String(r);
    }catch(_){ return ''; }
  });
  return u.trim();
}

function ctxOf(res, baseUrl){
  return {
    doc: Rule.mkDoc(res.text),
    node: null,
    baseUrl: baseUrl,
    html: res.text,
    json: res.json
  };
}

const Book = {

  async search(src, kw, page = 1){
    if(!src.searchUrl) throw new Error('该源没有搜索地址');
    let url = buildSearchUrl(src.searchUrl, kw, page);
    if(/^\//.test(url)) url = Rule.abs(url, src.bookSourceUrl);
    const res = await fetchText(url);
    const ctx = ctxOf(res, url);
    const r = src.ruleSearch || {};
    const els = Rule.list(r.bookList, ctx);
    const out = [];
    for(const el of els.slice(0, 40)){
      const c = { doc: ctx.doc, node: el, baseUrl: url, html: res.text, json: res.json };
      const name = Rule.str(r.name, c);
      if(!name) continue;
      const bookUrl = Rule.url(r.bookUrl, c);
      out.push({
        name,
        author: Rule.str(r.author, c) || '佚名',
        kind: Rule.str(r.kind, c),
        lastChapter: Rule.str(r.lastChapter, c),
        intro: Rule.str(r.intro, c),
        coverUrl: Rule.url(r.coverUrl, c),
        bookUrl: bookUrl || url,
        hasDetail: !!bookUrl,
        sourceUrl: src.bookSourceUrl,
        sourceName: src.bookSourceName
      });
    }
    if(!out.length){
      const c = { doc: ctx.doc, node: ctx.doc.documentElement, baseUrl: url, html: res.text, json: res.json };
      const name = Rule.str(r.name, c);
      if(name) out.push({
        name, author: Rule.str(r.author, c) || '佚名', intro: Rule.str(r.intro, c),
        coverUrl: Rule.url(r.coverUrl, c), bookUrl: Rule.url(r.bookUrl, c) || url,
        hasDetail: !!Rule.url(r.bookUrl, c), sourceUrl: src.bookSourceUrl, sourceName: src.bookSourceName
      });
    }
    return out;
  },

  async info(src, book){
    const url = book.bookUrl;
    const res = await fetchText(url);
    const ctx = ctxOf(res, url);
    const r = src.ruleBookInfo || {};
    const pick = k => Rule.str(r[k], ctx);
    const tocUrl = Rule.url(r.tocUrl, ctx);
    return {
      name: pick('name') || book.name,
      author: pick('author') || book.author,
      intro: pick('intro') || book.intro || '',
      kind: pick('kind') || book.kind || '',
      coverUrl: Rule.url(r.coverUrl, ctx) || book.coverUrl || '',
      lastChapter: pick('lastChapter') || book.lastChapter || '',
      wordCount: pick('wordCount') || '',
      tocUrl: tocUrl || '',
      _html: res.text
    };
  },

  async toc(src, book, info){
    const r = src.ruleToc || {};
    let tocUrl = (info && info.tocUrl) || book.tocUrl || '';
    let res, ctx;

    if(!tocUrl){
      if(info && info._html){
        res = { text: info._html, json: null };
        ctx = ctxOf(res, book.bookUrl);
      }else{
        res = await fetchText(book.bookUrl);
        ctx = ctxOf(res, book.bookUrl);
      }
      tocUrl = book.bookUrl;
    }else{
      res = await fetchText(tocUrl);
      ctx = ctxOf(res, tocUrl);
    }

    let els = Rule.list(r.chapterList, ctx);
    if(!els.length && tocUrl !== book.bookUrl){
      res = await fetchText(book.bookUrl);
      ctx = ctxOf(res, book.bookUrl);
      els = Rule.list(r.chapterList, ctx);
    }

    const list = [];
    const seen = new Set();
    for(const el of els){
      const c = { doc: ctx.doc, node: el, baseUrl: tocUrl, html: res.text, json: res.json };
      const name = Rule.str(r.chapterName, c);
      if(!name) continue;
      const cu = Rule.url(r.chapterUrl, c);
      const isVol = !!(r.isVolume && Rule.str(r.isVolume, c));
      const key = name + '|' + cu;
      if(seen.has(key)) continue;
      seen.add(key);
      list.push({ name: name.replace(/\s+/g, ' ').trim(), url: cu || tocUrl, isVol });
    }
    return { list, tocUrl };
  },

  async content(src, chapter, baseUrl){
    const r = src.ruleContent || {};
    let url = chapter.url || baseUrl;
    const out = [];
    const visited = new Set();

    for(let page = 0; page < 4; page++){
      if(!url || visited.has(url)) break;
      visited.add(url);
      const res = await fetchText(url);
      const ctx = ctxOf(res, url);
      let part = Rule.str(r.content, ctx);
      if(!part && page === 0 && ctx.doc.body){
        part = ctx.doc.body.innerHTML;
      }
      if(part) out.push(part);
      const next = Rule.url(r.nextContentUrl, ctx);
      if(!next || next === url) break;
      url = next;
    }
    return out.join('\n');
  }
};

/* 并发池 */
async function pool(tasks, limit, onTick){
  const results = new Array(tasks.length);
  let i = 0, done = 0;
  async function worker(){
    while(i < tasks.length){
      const idx = i++;
      try{ results[idx] = await tasks[idx](); }
      catch(e){ results[idx] = { __err: e.message }; }
      done++;
      if(onTick) onTick(done, tasks.length);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
  return results;
}

/* =========================================================
   6. 渲染
   ========================================================= */
let searchSeq = 0;

function withTimeout(p, ms){
  return Promise.race([
    p,
    new Promise((_, rej) => setTimeout(() => rej(new Error('请求超时')), ms))
  ]);
}

const SEARCH_TIMEOUT = 15000;   // 内置 90 个源时，25s 会让个别死源拖住整体；15s 够活源返回

/* ---------- 书名相关性打分 ----------
   很多站点的搜索是模糊匹配，搜「三体」会给你《三体全集》《三体前传》。
   这里按书名匹配程度排序，并在有匹配结果时默认把无关的收起来。 */
function normTitle(s){
  return String(s || '').replace(/[\s《》〈〉【】\[\]()（）·・:：\-—_.,，。!！?？'"'‘’“”~～]/g, '').toLowerCase();
}
function titleScore(name, kwN){
  const n = normTitle(name);
  if(!n || !kwN) return 0;
  if(n === kwN) return 4;            // 书名就是关键词
  if(n.includes(kwN)) return 3;      // 书名包含关键词
  let all = true;                    // 关键词每个字都出现（顺序不限）
  for(const ch of kwN){ if(!n.includes(ch)){ all = false; break; } }
  return all ? 1 : 0;
}

let onlyMatch = true;   // 有书名匹配结果时，是否只显示匹配的
let searchAbort = 0;    // 递增即作废当前这一轮

async function doSearch(){
  const kw = $('#kw').value.trim();
  if(!kw) return;
  const includeDead = !!window.__searchDead;   // 一次性开关：这次连失效源一起搜
  window.__searchDead = false;
  const all = S.sources.filter(s => s.enabled !== false && (s.bookSourceType || 0) === 0 && s.searchUrl);
  // 后端模式能执行 @js: 规则，不再排除这类书源
  let enabled = BE.ok ? all : all.filter(s => !criticalJs(s));
  const skipped = all.length - enabled.length;
  if(!enabled.length){
    toast(all.length ? '这些书源的规则用了 JS 脚本，网页版跑不了' : '还没有可用的书源，先去「书源」导入');
    return;
  }

  // 已知失效的源（上次搜索/测源失败过）默认跳过：466 个源里真正活的不到三分之一，
  // 全跑一遍要好几分钟，翻一遍死源没意义。
  const knownBad = enabled.filter(s => s.health === 'fail');
  let skippedBad = 0;
  if(knownBad.length && !includeDead){
    skippedBad = knownBad.length;
    enabled = enabled.filter(s => s.health !== 'fail');
  }
  if(!enabled.length){
    toast('剩下的源都被标成失效了，可以在「书源」里测源后清理，或强制连失效源一起搜');
    return;
  }

  // 排在前面的先跑：测源通过的 → 没测过的
  const rank = s => s.health === 'ok' ? 0 : 1;
  enabled = [...enabled].sort((a, b) => rank(a) - rank(b));

  const seq = ++searchSeq;
  const abort = ++searchAbort;
  resetNet();
  onlyMatch = true;

  const kwN = normTitle(kw);
  const seen = new Set();
  // okCount 有结果 / zeroCount 正常但没这本书 / errCount 请求失败（站点死了、被墙、规则改版）
  let items = [], okCount = 0, zeroCount = 0, errCount = 0, doneCount = 0;
  let firstErr = '';

  const rowHtml = (b, i) => {
    const cov = b.coverUrl ? `<img src="${esc(imgSrc(b.coverUrl))}" onerror="this.remove()">` : '';
    return `<div class="row" data-idx="${i}">
      <div class="cover"><span class="ph">${esc(b.name.slice(0,1))}</span>${cov}</div>
      <div class="row-main">
        <div class="row-title">${esc(b.name)}</div>
        <div class="row-meta">${esc(b.author)}${b.kind ? ' · ' + esc(b.kind) : ''}</div>
        ${b.lastChapter ? `<div class="row-desc">最新：${esc(b.lastChapter)}</div>` : (b.intro ? `<div class="row-desc">${esc(b.intro)}</div>` : '')}
        <div style="margin-top:6px"><span class="tag">${esc(b.sourceName)}</span></div>
      </div>
    </div>`;
  };

  /* 每个源一返回就刷新列表，避免被最慢的源卡住 */
  const paint = (loading) => {
    if(seq !== searchSeq) return;

    const scored = items.map(b => ({ b, s: titleScore(b.name, kwN) }));
    const matched = scored.filter(x => x.s >= 3).length;
    const shown = (onlyMatch && matched) ? scored.filter(x => x.s >= 3) : scored;
    shown.sort((x, y) => y.s - x.s || x.b.name.localeCompare(y.b.name, 'zh'));

    const pct = enabled.length ? Math.round(doneCount / enabled.length * 100) : 0;
    const deadTail = skippedBad
      ? ` · <span data-dead style="color:var(--accent)">跳过 ${skippedBad} 个已失效源</span>`
      : '';
    if(!items.length){
      $('#search-status').innerHTML = loading
        ? `<span class="spin"></span> ${doneCount}/${enabled.length} 个源已完成 · ${pct}%` + deadTail +
          ` <span data-stop style="color:var(--accent);margin-left:6px">停止</span>`
        : `没有结果 · ${okCount} 个源正常，${zeroCount} 个源里没这本书，${errCount} 个源请求失败${skipped ? `，跳过 ${skipped} 个` : ''}` + deadTail;
    }else{
      const tail = (matched && shown.length !== scored.length)
        ? ` · <span data-toggle style="color:var(--accent)">${onlyMatch ? `显示其他 ${scored.length - matched} 条` : '只看书名匹配'}</span>`
        : '';
      // 一条书名都没匹配上时，列表里全是源返回的推荐位/相似书，得说清楚
      const noHit = (!matched && !loading) ? '没找到书名匹配，以下是源返回的其他结果 · ' : '';
      $('#search-status').innerHTML = noHit +
        `共 ${shown.length} 条${matched && onlyMatch ? `（书名匹配 ${matched}）` : ''} · ` +
        `${doneCount}/${enabled.length} 个源${loading ? '处理中' : '已完成'}${pct ? ` ${pct}%` : ''}` +
        (errCount ? ` · ${errCount} 个源报错` : '') +
        (skipped ? ` · 跳过 ${skipped} 个` : '') + deadTail + tail +
        (loading ? ` <span data-stop style="color:var(--accent)">停止</span>` : '');
    }
    $('#search-results').innerHTML = shown.map((x, i) => rowHtml(x.b, i)).join('');
    window.__results = shown.map(x => x.b);

    const st = $('#search-status [data-stop]');
    if(st) st.onclick = () => { searchAbort++; searchSeq++; paint(false); toast('已停止，已拿到的结果保留'); };
    const tg = $('#search-status [data-toggle]');
    if(tg) tg.onclick = () => { onlyMatch = !onlyMatch; paint(loading); };
    const dl = $('#search-status [data-dead]');
    if(dl) dl.onclick = () => {
      window.__searchDead = true;
      toast(`这次连 ${skippedBad} 个失效源一起搜，会慢好几分钟`);
      doSearch();
    };
  };

  $('#search-results').innerHTML = '';
  paint(true);

  let dirty = false;
  const tasks = enabled.map(src => async () => {
    if(abort !== searchAbort) return;
    try{
      const list = await withTimeout(Book.search(src, kw, 1), SEARCH_TIMEOUT);
      doneCount++;
      if(list.length){
        okCount++;
        if(src.health !== 'ok'){ src.health = 'ok'; dirty = true; }
        // 同一本书同一个源只留一条
        for(const b of list){
          const k = (b.sourceName || '') + '|' + (b.bookUrl || b.name);
          if(seen.has(k)) continue;
          seen.add(k);
          items.push(b);
        }
      }
      else zeroCount++;
    }catch(e){
      doneCount++;
      errCount++;
      // 只有「报错」才记失效；零结果可能只是这个源没这本书。
      // 超时单独处理：源慢不等于源死了，标成 fail 会被永久跳过，
      // 下次它就再也没机会证明自己——这类源应当下次重试。
      const timedOut = /超时|timed?\s*out|timeout/i.test(String((e && e.message) || ''));
      if(!timedOut && src.health !== 'fail'){ src.health = 'fail'; dirty = true; }
      if(!firstErr) firstErr = e.message || '未知错误';
    }
    paint(true);
  });

  await pool(tasks, 14);
  if(dirty){ saveSources(); }
  if(seq !== searchSeq || abort !== searchAbort) return;

  // 同名书合并展示：标注来源，方便用户换源
  paint(false);

  if(!items.length){
    $('#search-results').innerHTML =
      `<div class="empty">这 ${enabled.length} 个源都没有「${esc(kw)}」。` +
      `<br><span style="font-size:12px;opacity:.7">可以点「书源 → 测源」把失效源删掉，或导入新的书源包</span>` +
      (skipped ? `<br><span style="font-size:12px;opacity:.7">另有 ${skipped} 个源用了网页跑不了的 JS 规则</span>` : '') +
      (firstErr ? `<br><span style="font-size:12px;opacity:.7">${esc(firstErr)}</span>` : '') + `</div>`;
  }
}

/* 详情 */
let curBook = null, curSource = null, curInfo = null, curToc = null;

async function openDetail(book){
  curBook = book;
  curSource = S.sources.find(s => s.bookSourceUrl === book.sourceUrl) || null;
  curInfo = null; curToc = null;

  showPage('p-detail');
  renderDetail(book, null, 'loading');

  if(!curSource){ renderDetail(book, null, 'nosource'); return; }

  try{
    if(book.hasDetail === false){
      curInfo = { ...book, tocUrl: '' };
      renderDetail(book, curInfo, 'ready');
      loadTocForDetail();
    }else{
      const info = await Book.info(curSource, book);
      curInfo = info;
      renderDetail(book, info, 'ready');
      loadTocForDetail();
    }
  }catch(e){
    curInfo = { ...book, tocUrl: '', _err: e.message };
    renderDetail(book, curInfo, 'error');
    loadTocForDetail();
  }
}

async function loadTocForDetail(){
  if(!curSource || !curInfo) return;
  try{
    const t = await Book.toc(curSource, { ...curBook, tocUrl: curInfo.tocUrl || '' }, curInfo);
    curToc = t;
    const n = t.list.filter(x => !x.isVol).length;
    const el = $('#toc-count'); if(el) el.textContent = `${n} 章`;
    fillDetailChaps();
  }catch(e){
    const el = $('#toc-count'); if(el) el.textContent = '目录失败';
  }
}

function renderDetail(book, info, state){
  const name = (info && info.name) || book.name;
  const author = (info && info.author) || book.author;
  const intro = (info && info.intro) || book.intro || '暂无简介';
  const cover = (info && info.coverUrl) || book.coverUrl || '';
  const kind = (info && info.kind) || book.kind || '';
  const last = (info && info.lastChapter) || book.lastChapter || '';

  const covHtml = `<div class="cover">
      <span class="ph">${esc(name.slice(0,1))}</span>
      ${cover ? `<img src="${esc(imgSrc(cover))}" onerror="this.remove()">` : ''}
    </div>`;

  let tips = '';
  if(state === 'nosource') tips = `<div class="status" style="color:#c0392b">找不到对应的书源</div>`;
  if(state === 'error') tips = `<div class="status" style="color:#c0392b">详情页抓取失败：${esc(info._err || '')}</div>`;

  $('#detail-scroll').innerHTML = `
    <div class="detail-hero">
      ${covHtml}
      <div class="detail-info">
        <div class="detail-title">${esc(name)}</div>
        <div class="detail-author">${esc(author)}</div>
        <div class="detail-tags">
          ${kind ? `<span class="tag">${esc(kind)}</span>` : ''}
          <span class="tag">${esc(book.sourceName)}</span>
        </div>
        <div style="font-size:12px;color:var(--sub);margin-top:8px">${last ? '最新：' + esc(last) : ''}</div>
      </div>
    </div>
    ${tips}
    <div class="detail-actions">
      <button class="btn-main" id="btn-read" ${state === 'loading' ? 'disabled' : ''}>
        ${state === 'loading' ? '加载中…' : '开始阅读 <span id="toc-count" style="opacity:.8;font-size:13px"></span>'}
      </button>
      <button class="btn-ghost" id="btn-shelf-add">加入书架</button>
    </div>
    <div class="sec-title">简介</div>
    <div class="intro">${esc(intro)}</div>
    <div class="sec-title" id="detail-toc-title" style="display:none">目录</div>
    <div id="detail-chaps"></div>
    <div style="height:60px"></div>`;

  if(curToc){
    const n = curToc.list.filter(x => !x.isVol).length;
    const el = $('#toc-count'); if(el) el.textContent = `${n} 章`;

  }

}

function fillDetailChaps(){
  if(!curToc) return;
  const box = $('#detail-chaps');
  if(!box) return;
  const list = curToc.list.map((c, i) => ({ ...c, i })).filter(c => !c.isVol).slice(0, 12);
  if(!list.length) return;
  const tt = $('#detail-toc-title'); if(tt) tt.style.display = '';
  box.innerHTML = list.map(c => `<div class="toc-item" data-dch="${c.i}">${esc(c.name)}</div>`).join('')
    + (curToc.list.filter(x => !x.isVol).length > 12
        ? `<div class="toc-item" style="color:var(--accent);justify-content:center" data-dch="0">查看全部 ${curToc.list.filter(x => !x.isVol).length} 章 ›</div>` : '');
}

async function startReading(startIdx){
  if(!curSource || !curInfo) return;
  let toc = curToc;
  if(!toc || !toc.list.length){
    toast('正在加载目录…');
    try{
      toc = await Book.toc(curSource, { ...curBook, tocUrl: curInfo.tocUrl || '' }, curInfo);
      curToc = toc;
    }catch(e){ toast('目录加载失败：' + e.message); return; }
  }
  const list = toc.list;
  if(!list.length){ toast('没有解析到章节'); return; }

  const id = (curBook.sourceUrl + '|' + (curInfo.name || curBook.name)).slice(0, 200);
  const exist = S.shelf.find(b => b.id === id);
  let book;
  if(exist){
    exist.name = curInfo.name || curBook.name;
    exist.author = curInfo.author || curBook.author;
    exist.coverUrl = curInfo.coverUrl || curBook.coverUrl || '';
    exist.bookUrl = curBook.bookUrl;
    exist.tocUrl = toc.tocUrl || curInfo.tocUrl || '';
    exist.toc = list;
    exist.updatedAt = Date.now();     // 让云端同步认这次改动是新的
    book = exist;
  }else{
    book = {
      id, name: curInfo.name || curBook.name, author: curInfo.author || curBook.author,
      coverUrl: curInfo.coverUrl || curBook.coverUrl || '', bookUrl: curBook.bookUrl,
      sourceUrl: curBook.sourceUrl, tocUrl: toc.tocUrl || curInfo.tocUrl || '',
      toc: list, idx: 0, scroll: 0, addedAt: Date.now()
    };
    S.shelf.unshift(book);
  }
  saveShelf();
  const idx = typeof startIdx === 'number' ? startIdx : (book.idx || 0);
  const sc = typeof startIdx === 'number' ? 0 : (book.scroll || 0);
  openReader(book, idx, sc);
}

function addToShelf(){
  if(!curSource || !curInfo) return;
  const id = (curBook.sourceUrl + '|' + (curInfo.name || curBook.name)).slice(0, 200);
  if(S.shelf.some(b => b.id === id)){ toast('已经在书架里了'); return; }
  S.shelf.unshift({
    id, name: curInfo.name || curBook.name, author: curInfo.author || curBook.author,
    coverUrl: curInfo.coverUrl || curBook.coverUrl || '', bookUrl: curBook.bookUrl,
    sourceUrl: curBook.sourceUrl, tocUrl: curInfo.tocUrl || '',
    toc: curToc ? curToc.list : [], idx: 0, scroll: 0, addedAt: Date.now()
  });
  saveShelf();
  renderShelf();
  toast('已加入书架');
}

function renderShelf(){
  const box = $('#shelf-list');
  const editing = SHELF_EDIT.on;
  box.classList.toggle('editing', editing);

  if(!S.shelf.length){
    box.innerHTML = `<div class="empty" style="grid-column:1/-1">书架还是空的<br>去「搜书」找一本，点「开始阅读」就会出现在这里</div>`;
    if(editing) setShelfEdit(false);      // 清空了就自动退出编辑
    return;
  }

  box.innerHTML = S.shelf.map((b, i) => {
    const img = b.coverUrl
      ? `<div class="ph">${esc(b.name.slice(0,1))}</div><img src="${esc(imgSrc(b.coverUrl))}" onerror="this.remove()">`
      : `<div class="ph">${esc(b.name.slice(0,1))}</div>`;
    const pct = b.toc && b.toc.length ? Math.round(((b.idx || 0) / b.toc.length) * 100) : 0;
    const on = editing && SHELF_EDIT.sel.has(b.id);
    return `<div class="bookcard${editing ? ' editing' : ''}${on ? ' on' : ''}" data-i="${i}" data-bid="${esc(b.id)}">
      <div class="cover">${img}</div>
      <div class="bc-title">${esc(b.name)}</div>
      <div class="bc-sub">${b.toc && b.toc.length ? '读至 ' + pct + '%' : esc(b.author || '')}</div>
      ${editing ? `<div class="pick">${on ? '✓' : ''}</div>` : ''}
    </div>`;
  }).join('');
  updateShelfBar();
}

/* 进入 / 退出编辑态 */
function setShelfEdit(on){
  SHELF_EDIT.on = !!on;
  if(!SHELF_EDIT.on) SHELF_EDIT.sel.clear();
  // 操作栏贴在标签栏上方，高度现量一次（不同机型安全区不一样）
  const tb = $('#tabbar');
  const h = tb && tb.offsetHeight ? tb.offsetHeight : 54;
  document.documentElement.style.setProperty('--tab-h', h + 'px');
  const bar = $('#shelf-bar');
  if(bar) bar.classList.toggle('show', SHELF_EDIT.on);

  document.documentElement.style.setProperty('--toast-lift', SHELF_EDIT.on ? '62px' : '0px');
  const btn = $('#btn-edit');
  if(btn) btn.textContent = SHELF_EDIT.on ? '完成' : '编辑';
  renderShelf();
}

/* 操作栏文案与按钮状态 */
function updateShelfBar(){
  const n = SHELF_EDIT.sel.size;
  const total = S.shelf.length;
  const c = $('#sb-count');
  if(c){
    if(!SHELF_EDIT.on) c.textContent = '点书选择，或长按任意一本';
    else if(!n) c.textContent = '点书选择，或长按任意一本';
    else if(n === total) c.textContent = `已选全部 ${n} 本`;
    else c.textContent = `已选 ${n} / ${total} 本`;
  }
  const del = $('#sb-del');
  if(del) del.disabled = !n;
  const all = $('#sb-all');
  if(all) all.textContent = (n && n === total) ? '取消全选' : '全选';
}

/* 选中 / 取消选中一本（只改 DOM，不整块重绘，点起来更跟手） */
function togglePick(card, id){
  if(SHELF_EDIT.sel.has(id)) SHELF_EDIT.sel.delete(id);
  else SHELF_EDIT.sel.add(id);
  const on = SHELF_EDIT.sel.has(id);
  if(card){
    card.classList.toggle('on', on);
    const pk = card.querySelector('.pick');
    if(pk) pk.textContent = on ? '✓' : '';
  }
  updateShelfBar();
}

/* 把选中的书移出书架 */
function removePicked(){
  const ids = [...SHELF_EDIT.sel];
  if(!ids.length) return;
  const names = S.shelf.filter(b => SHELF_EDIT.sel.has(b.id)).map(b => b.name);
  const ask = names.length <= 3
    ? `把「${names.join('」「')}」移出书架？`
    : `把选中的 ${names.length} 本移出书架？`;
  if(!confirm(ask)) return;

  for(let k = S.shelf.length - 1; k >= 0; k--){
    if(SHELF_EDIT.sel.has(S.shelf[k].id)) S.shelf.splice(k, 1);
  }
  SHELF_EDIT.sel.clear();
  saveShelf(ids);          // 带墓碑推上去，其它设备下次拉取也会删掉
  renderShelf();
  toast(`已移出 ${ids.length} 本`);
  if(!S.shelf.length) setShelfEdit(false);
}

/* =========================================================
   6b. 订阅源（RSS）
   ========================================================= */
async function feedArticles(src, page, sortUrl){
  // 后端模式：服务端解析，能跑 @js: / JSONPath / 标准 RSS XML，比前端强得多
  if(BE.ok){
    const r = await BE.post('/api/feed', { source: src, sortUrl: sortUrl || src.sortUrl || '', page: page || 1 });
    feedLastSorts = (r && Array.isArray(r.sorts)) ? r.sorts : [];
    if(r && Array.isArray(r.items) && r.items.length) {
      feedLastMode = r.mode || '';
      return r.items;
    }
    if(r && r.warn) throw new Error(r.warn);
    // 后端明确说没内容，就别再用前端那套重复跑一遍了
    if(r && Array.isArray(r.items)) { feedLastMode = r.mode || ''; return []; }
  }

  let url = String(sortUrl || src.sourceUrl || '').split('#')[0];
  url = url.replace(/\{\{page\}\}/g, '1').replace(/\{\{key\}\}/g, '');
  // 像知乎日报这种以 / 结尾的 API 根地址，补当天日期
  if(/\/$/.test(url) && /\/api\//.test(url)){
    const d = new Date();
    const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    url = url + ymd;
  }
  const res = await fetchText(url);
  const ctx = ctxOf(res, url);
  const els = Rule.list(src.ruleArticles, ctx);
  const out = [];
  for(const el of els.slice(0, 60)){
    const c = { doc: ctx.doc, node: el, baseUrl: url, html: res.text, json: res.json };
    const name = Rule.str(src.ruleTitle, c);
    const link = Rule.url(src.ruleLink, c);
    if(!name && !link) continue;
    out.push({
      name: name || '(无标题)',
      url: link || url,
      date: Rule.str(src.rulePubDate, c),
      desc: Rule.str(src.ruleDescription, c),
      img: Rule.url(src.ruleImage, c)
    });
  }
  return out;
}

/* 上一次列表是怎么来的：xml（标准订阅）/ rule（规则）/ guess（网页猜的） */
let feedLastMode = '';
/* 这个源有哪些分类/线路（一个源里套多个站的情况很常见） */
let feedLastSorts = [];

/* 没有正文规则时，猜一个正文容器 */
function extractReadable(doc){
  if(!doc || !doc.body) return '';
  const sels = ['article', '.article', '.post-content', '.entry-content', '.rich_media_content',
                '#content', '.content', '.post', '.detail', '.article-content', 'main'];
  let best = null, bestLen = 0;
  for(const sel of sels){
    let nodes = [];
    try{ nodes = [...doc.querySelectorAll(sel)]; }catch(e){}
    for(const n of nodes){
      const len = (n.textContent || '').replace(/\s/g, '').length;
      if(len > bestLen){ best = n; bestLen = len; }
    }
  }
  if(!best || bestLen < 120) best = doc.body;
  const c = best.cloneNode(true);
  c.querySelectorAll('script,style,nav,header,footer,aside,iframe,form,button').forEach(n => n.remove());
  return c.innerHTML;
}

async function feedContent(src, article){
  if(BE.ok){
    try{
      const r = await BE.post('/api/feed/content', { source: src, article });
      if(r && r.html) return r.html;
    }catch(e){ /* 后端挂了就走前端老路 */ }
  }
  const res = await fetchText(article.url);
  const ctx = ctxOf(res, article.url);
  let html = '';
  if(src.ruleContent && !/@js:|<js>/i.test(String(src.ruleContent))){
    html = Rule.str(src.ruleContent, ctx);
  }
  if(!html) html = extractReadable(ctx.doc);
  return html;
}

    const sorts = feedLastSorts || [];
    const curUrl = sortUrl || (sorts[0] && sorts[0].url) || '';
    const sortBar = sorts.length > 1
      ? `<div style="display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;white-space:nowrap;-webkit-overflow-scrolling:touch">${
          sorts.map(s => `<span data-sort="${esc(s.url)}" style="flex:0 0 auto;padding:5px 12px;border-radius:14px;font-size:12.5px;cursor:pointer;${
            s.url === curUrl ? 'background:var(--accent);color:#fff' : 'background:var(--surface2);color:var(--sub)'

      : '';

    $('#feed-list').innerHTML = sortBar + modeHint + items.map((a, j) => `

        ${a.img ? `<img class="feed-thumb" src="${esc(imgSrc(a.img))}" onerror="this.remove()">` : ''}
      </div>`).join('');
    bindFeedSorts(i);
  }catch(e){
    $('#feed-list').innerHTML = `<div class="empty">加载失败：${esc(e.message)}<br><br>换个订阅源试试，或检查代理是否可用</div>`;

let srcSeg = 'book';

/* 一键测源：拿固定关键词试搜一次，能出结果就算活 */
/* 一次测源最多跑这么多。整合包几百个源，全测要几十分钟，
   分几次点就行——每次都优先测还没测过的。 */
const TEST_CAP = 120;
const TEST_TIMEOUT = 25000;

async function testSources(){
  const list = S.sources.filter(s => s.enabled !== false && (s.bookSourceType || 0) === 0);
  const usable = BE.ok ? list : list.filter(s => !criticalJs(s));
  if(!usable.length){ toast('没有可测的源'); return; }

  // 未测 > 上次失败 > 已通过（前者信息量更大）
  const rank = s => s.health === undefined ? 0 : (s.health === 'fail' ? 1 : 2);
  const queue = [...usable].sort((a, b) => rank(a) - rank(b));
  const batch = queue.slice(0, TEST_CAP);
  const rest = queue.length - batch.length;

  const btn = $('#btn-test');
  btn.disabled = true;
  let done = 0;
  const total = batch.length;
  btn.textContent = `检测 0/${total}`;

  const tasks = batch.map(src => async () => {
    try{
      // 没有单源超时的话，一个死站就能把整轮拖住
      const r = await withTimeout(Book.search(src, '剑', 1), TEST_TIMEOUT);
      src.health = r.length ? 'ok' : 'fail';
    }catch(e){ src.health = 'fail'; }
    done++;
    btn.textContent = `检测 ${done}/${total}`;
    return 1;
  });

  await pool(tasks, 4);

  if(!BE.ok) list.forEach(src => { if(criticalJs(src)) src.health = 'js'; });
  await saveSources();
  renderSources();

  btn.disabled = false;
  btn.textContent = '测源';
  const ok = S.sources.filter(s => s.health === 'ok').length;
  toast(`检测完成：本轮 ${batch.length} 个里有 ${batch.filter(s => s.health === 'ok').length} 个可用` +
        (rest ? `，还有 ${rest} 个没测（再点一次继续）` : `　共 ${ok} 个可用`), 4000);
}

function renderSources(){
  const total = S.sources.length;
  const on = S.sources.filter(s => s.enabled !== false).length;
  $('#src-sum').textContent = total ? `${on}/${total} 已启用` : '';
  $('#src-count').textContent = total
    ? (on === total ? `${total} 个源` : `${on}/${total} 个源`)
    : '未导入书源';

  const box = $('#src-list');
  if(!total){
    box.innerHTML = `<div class="empty">还没有书源<br><br>点上面的「导入书源」<br>把从「阅读」App 里导出的 JSON 粘进来</div>`;
    return;
  }
  box.innerHTML = S.sources.map((s, i) => `
    <div class="src-item ${s.enabled === false ? 'off' : ''}">
      <span class="dot ${s.health === 'ok' ? 'ok' : s.health === 'fail' ? 'bad' : ''}"></span>
      <div class="src-info">
        <div class="src-name">${esc(s.bookSourceName)}</div>
        <div class="src-url">${esc(s.bookSourceUrl)}${s.bookSourceGroup ? ' · ' + esc(s.bookSourceGroup) : ''}</div>
      </div>
      <div class="switch ${s.enabled === false ? '' : 'on'}" data-toggle="${i}"></div>
      <button class="small-x" data-del="${i}">✕</button>

}

   7. 阅读器

const RD = { book: null, idx: 0, loading: false, pendingScroll: 0, session: 0, request: 0, lastSaved: null };

const RD_THEMES = {
  paper: { bg:'#f6f1e6', fg:'#2b2620', panel:'#fffdf8', line:'#e2dac9' },
  white: { bg:'#ffffff', fg:'#1a1a1a', panel:'#ffffff', line:'#e6e6e6' },
  green: { bg:'#cce8cf', fg:'#22331f', panel:'#e4f2e5', line:'#b6d3b9' },
