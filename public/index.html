};

/* ---------- 字体 ----------
   网页没法「枚举」手机里装了哪些字体：iOS Safari 不提供任何本地字体接口，
   Android Chrome 的 Local Font Access API 要用户授权且只给一部分。
   所以反过来做——拿一批常见中文字体名去实测宽度：装了的才列出来，
   没装的不显示，省得点了半天没反应还以为是 bug。
   实测方法：同一串字，用 "候选字体,monospace" 和纯 monospace 各量一次宽度，
   宽度不同说明浏览器真的用上了候选字体（回退的话两次必然相等）。 */
const FONT_POOL = [
  { id:'sys',   name:'系统',   names:[], css:'-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif' },
  { id:'ping',  name:'苹方',   names:['PingFang SC','PingFang HK','PingFang TC'], css:'"PingFang SC","PingFang HK","Heiti SC",sans-serif' },
  { id:'hei',   name:'黑体',   names:['Heiti SC','STHeiti','SimHei','Microsoft YaHei'], css:'"Heiti SC","STHeiti","SimHei","Microsoft YaHei",sans-serif' },
  { id:'song',  name:'宋体',   names:['Songti SC','STSong','SimSun','NSimSun','Songti TC'], css:'"Songti SC","STSong","SimSun",serif' },
  { id:'kai',   name:'楷体',   names:['Kaiti SC','STKaiti','KaiTi','Kaiti TC'], css:'"Kaiti SC","STKaiti","KaiTi",serif' },
  { id:'yuan',  name:'圆体',   names:['Yuanti SC','STYuanti','Yuanti TC'], css:'"Yuanti SC","STYuanti",sans-serif' },
  { id:'hira',  name:'冬青黑', names:['Hiragino Sans GB','Hiragino Sans'], css:'"Hiragino Sans GB","Hiragino Sans",sans-serif' },
  { id:'noto',  name:'思源黑', names:['Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC'], css:'"Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC",sans-serif' },
  { id:'nserif',name:'思源宋', names:['Noto Serif CJK SC','Source Han Serif SC','Noto Serif SC'], css:'"Noto Serif CJK SC","Source Han Serif SC",serif' },
  { id:'wenkai',name:'霞鹜文楷',names:['LXGW WenKai','LXGWWenKai','LXGW WenKai Lite','LXGWWenKaiGB'], css:'"LXGW WenKai","LXGWWenKai",serif' },
];

function fontInstalled(names){
  if(!names || !names.length) return true;          // 「系统」永远可用
  try{
    const c = document.createElement('canvas').getContext('2d');
    // 用拉丁字符做探针：中文是全角，任何字体下都是 1em 宽，测不出差异；
    // 拉丁部分是比例宽度，装没装一眼就分得出来。
    const probe = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    const measure = f => { c.font = '48px ' + f; return c.measureText(probe).width; };
    const ref = measure('monospace');
    return names.some(n => Math.abs(measure('"' + n + '",monospace') - ref) > 1.5);
  }catch(e){ return false; }
}

let FONT_AVAILABLE = null;
function availableFonts(){
  if(!FONT_AVAILABLE) FONT_AVAILABLE = FONT_POOL.filter(f => fontInstalled(f.names));
  return FONT_AVAILABLE;
}
function fontCss(id){
  if(id === 'custom'){
    const n = String(S.settings.reader.fontCustom || '').trim().replace(/^["']|["']$/g, '');
    if(n) return '"' + n + '",serif';
    return FONT_POOL[0].css;
  }
  const f = FONT_POOL.find(x => x.id === id);
  return (f && f.css) || FONT_POOL[0].css;
}
/* 选中的字体在当前设备上不存在时，悄悄退回「系统」，并把设置改掉，
   否则用户下次打开还是看着一个点了没反应的选项。 */
function reconcileFont(){
  const r = S.settings.reader;
  // 手动指定的字体在这台设备上不可用了（换手机 / 卸载字体）就一并清掉
  if(r.fontCustom && !fontInstalled([r.fontCustom])){ r.fontCustom = ''; saveSettings(); }
  if(r.font === 'custom'){
    if(String(r.fontCustom || '').trim() && fontInstalled([r.fontCustom])) return 'custom';
    r.font = 'sys'; saveSettings(); return 'sys';
  }
  if(!availableFonts().some(f => f.id === r.font)){
    r.font = 'sys';
    saveSettings();
  }
  return r.font;
}

/* 池子里没有的字体：让用户直接填名字。填完当场实测，能用才切换。 */
function askCustomFont(){
  openModal({
    title: '指定字体',
    body: `<p>填一个手机里<b>已经装好</b>的字体名，这里会当场实测能不能用。</p>
      <input type="text" id="font-name" value="${esc(S.settings.reader.fontCustom || '')}"
        placeholder="例如 Kaiti SC / LXGW WenKai"
        style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:15px">
      <p style="margin-top:10px;font-size:12px">不知道名字？iPhone 可以到「设置 → 通用 → 字体」里看已装字体；Android 用英文字体名最稳。</p>`,
    buttons: [
      { text: '取消' },
      { text: '使用', cls: 'mb-ok', onClick: () => {
          const name = ($('#font-name').value || '').trim().replace(/^["']|["']$/g, '');
          if(!name){ toast('还没填字体名'); return false; }
          if(!fontInstalled([name])){ toast('这台设备上找不到「' + name + '」'); return false; }
          S.settings.reader.fontCustom = name;
          S.settings.reader.font = 'custom';
          renderFontChips();
          applyReaderStyle();
          saveSettings();
          toast('已切换到 ' + name);
        } }
    ]
  });
}

function renderFontChips(){
  const box = $('#fonts');
  if(!box) return;
  const cur = reconcileFont();
  const r = S.settings.reader;
  const list = availableFonts().slice();
  // 手动指定过的字体也列出来，方便来回切
  if(r.fontCustom && fontInstalled([r.fontCustom]) && !list.some(f => f.name === r.fontCustom)){
    list.push({ id:'custom', name: r.fontCustom });
  }
  box.innerHTML = list.map(f =>
    `<button class="chip${f.id === cur ? ' on' : ''}" data-font="${f.id}">${esc(f.name)}</button>`
  ).join('') + '<button class="chip" id="font-add" title="手动指定字体名">＋</button>';
  box.querySelectorAll('[data-font]').forEach(b => {
    b.onclick = () => { S.settings.reader.font = b.dataset.font; applyReaderStyle(); saveSettings(); };
  });
  const add = box.querySelector('#font-add');
  if(add) add.onclick = askCustomFont;
}

function applyReaderStyle(){
  const r = S.settings.reader;
  // 旧版本存的是 tap（点一下滚一屏），现在统一走左右翻页
  if(r.paging === 'tap') r.paging = 'slide';
  const t = RD_THEMES[r.theme] || RD_THEMES.paper;
  const rd = $('#reader');
  rd.style.setProperty('--rd-bg', t.bg);
  rd.style.setProperty('--rd-fg', t.fg);
  rd.style.setProperty('--rd-panel', t.panel);
  rd.style.setProperty('--rd-line', t.line);
  rd.style.setProperty('--fs', r.fs + 'px');
  rd.style.setProperty('--lh', (r.lh / 10).toFixed(2));
  rd.style.setProperty('--pg', (r.pg / 10).toFixed(2) + 'em');
  rd.style.setProperty('--rd-font', fontCss(reconcileFont()));

  $('#set-fs').value = r.fs; $('#v-fs').textContent = r.fs;
  $('#set-lh').value = r.lh; $('#v-lh').textContent = (r.lh / 10).toFixed(1);
  $('#set-pg').value = r.pg; $('#v-pg').textContent = (r.pg / 10).toFixed(1);
  const dim = Math.max(0, Math.min(60, r.dim || 0));
  // dim 存的是「压暗程度」，滑块右端应该是「最亮」，所以显示时把值取反
  $('#set-dim').value = 60 - dim; $('#v-dim').textContent = (100 - Math.round(dim / 60 * 55)) + '%';
  $('#rd-dim').style.opacity = (dim / 100).toFixed(2);
  document.querySelectorAll('[data-rdtheme]').forEach(b => b.classList.toggle('on', b.dataset.rdtheme === r.theme));
  document.querySelectorAll('[data-font]').forEach(b => b.classList.toggle('on', b.dataset.font === r.font));
  document.querySelectorAll('[data-paging]').forEach(b => b.classList.toggle('on', b.dataset.paging === (r.paging || 'scroll')));
  // 底部「昼夜」键显示的是「点下去会变成什么」
  const night = $('#rd-night-t');
  if(night) night.textContent = r.theme === 'dark' ? '日间' : '夜间';

  const isDark = r.theme === 'dark';
  // 浏览器/系统 UI（Safari 工具栏、滚动条、表单控件）跟着变深，状态栏才不会突兀
  document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
  // 阅读器可见时根节点也铺成主题底色：iOS 下拉回弹不会闪出浅色
  document.documentElement.classList.toggle('rd-night', isDark && rd.classList.contains('show'));
  // 记一份主题给下次冷启动用，head 里的内联脚本会读它，避免夜间启动先闪浅色
  try{ localStorage.setItem('rd_theme', r.theme); }catch(e){}
  // 状态栏跟着主题走（写死 black 会让日间顶上也压一条黑边）
  const barMeta = document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]');
  if(barMeta) barMeta.setAttribute('content', isDark ? 'black' : 'default');
  const meta = document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', t.bg);
  rd.setAttribute('data-rdark', isDark ? '1' : '0');
  paintManifest(t.bg);
  if(RD.book) slideRelayout();      // 字号 / 行距 / 翻页方式变了都要重新分栏
}

function openReader(book, idx, scroll){

function closeReader(){

  // 存下去等于把"读到第几章"改成了还没打开的那一章。
  if(RD.book && !RD.loading) saveProgress();
  RD.session++;                      // 退出即作废所有在途请求
  RD.request++;
  rdPreToken++;
  hideSheet();                       // 顺手收掉抽屉与遮罩，防止残留暗层挡住点击
  hideTips(false);
  $('#reader').classList.remove('show');
  $('#reader').style.transform = '';
  document.documentElement.classList.remove('rd-night');   // 书架/搜索页仍用原来的浅色

  RD.loading = false;

/* ---------- 全屏 ----------
   Android Chrome / 桌面浏览器能真的进全屏；iOS Safari 不支持 Fullscreen API，
   只能「分享 → 添加到主屏幕」，从主屏图标打开时没有地址栏（standalone）。 */
async function toggleFullscreen(){
  const d = document.documentElement;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
      return;
    }
    if(d.requestFullscreen){
      await d.requestFullscreen({ navigationUI: 'hide' });
      return;
    }
  }catch(e){ /* 落到下面的提示 */ }

  if(ios){
    openModal({
      title: '在 iPhone 上去掉地址栏',
      body: `<div style="font-size:14px;line-height:1.8">
        Safari 不允许网页自己隐藏地址栏，但可以把它变成独立 App：<br>
        1. 点底部 <b>分享</b> 按钮（方框带向上箭头）<br>
        2. 选 <b>添加到主屏幕</b><br>
        3. 从桌面图标打开，就是全屏无地址栏，正文一直铺到屏幕底部
      </div>`,
      buttons: [{ text: '知道了', cls: 'mb-ok' }]
    });
  }else{
    toast('这个浏览器不支持全屏，试试把页面加到主屏幕');
  }
}

async function rdGo(i, resetScroll){
  if(!RD.book || RD.loading) return;
  const list = RD.book.toc;
  if(i < 0 || i >= list.length) return;
  const src = rdSource();
  if(!src){ toast('书源已不存在'); return; }

  // 这一代请求的身份：途中退出本书、换书、再翻别的章，回来时就知道自己过期了
  const session = RD.session, request = ++RD.request, book = RD.book;

  RD.idx = i;
  const ch = list[i];
  $('#rd-title').textContent = ch.name;
  updateRdBar();

  // 命中本地缓存：直接上屏，没有加载态
  const hit = rdCacheGet(ch);
  if(hit){
    rdPaint(hit, ch, resetScroll);
    rdPrefetch();
    return;
  }

  RD.loading = true;
  $('#rd-content').innerHTML = `<p style="text-align:center;text-indent:0;padding:60px 0"><span class="spin"></span></p>`;
  $('#rd-body').scrollTop = 0;

  try{
    const raw = await rdFetch(src, ch);
    // A 书加载中退出、打开 B 书：A 的迟到响应不能把 B 的正文和进度改掉
    if(RD.session !== session || RD.request !== request || RD.book !== book) return;
    if(!raw) throw new Error('没取到正文，可能是这个源失效了');
    rdCacheSet(ch, raw);
    RD.loading = false;
    rdPaint(raw, ch, resetScroll);
    rdPrefetch();
  }catch(e){
    if(RD.session !== session || RD.request !== request || RD.book !== book) return;
    RD.loading = false;
    $('#rd-content').innerHTML = `<p style="text-indent:0;color:#c0392b;text-align:center;padding:50px 10px">
      加载失败：${esc(e.message)}<br>
      <button onclick="rdReload()" style="margin-top:16px;padding:9px 22px;border:1px solid #ddd;border-radius:9px">重试</button></p>`;
  }
}

function rdSource(){
  if(!RD.book) return null;
  return RD.book.kind === 'rss'
    ? S.rss.find(s => s.sourceUrl === RD.book.sourceUrl)
    : S.sources.find(s => s.bookSourceUrl === RD.book.sourceUrl);
}

/* ---------- 客户端章节缓存 ----------
   服务端已经会预取，这里再存一份在页面里：
   来回翻、退出再进同一章都不用再发请求。 */
const RD_CACHE = new Map();
const RD_CACHE_MAX = 12;

/* 缓存键必须带上「这本书」，不能只用章节地址：
   同一个站的不同书可能共用章节 URL 形态，退出再打开另一本时，
   旧书的正文会顶掉新书的（Codex 复核里复现过）。 */
function rdCacheKey(ch){
  const b = RD.book;
  if(!ch || !ch.url) return '';
  return (b ? (b.sourceUrl || '') + '|' + (b.bookUrl || '') : '') + '|' + ch.url;
}

function rdCacheGet(ch){
  const k = rdCacheKey(ch);
  if(!k) return null;
  const v = RD_CACHE.get(k);
  if(v){
    RD_CACHE.delete(k); RD_CACHE.set(k, v);   // LRU
    return v;
  }
  return null;
}
function rdCacheSet(ch, html){
  const k = rdCacheKey(ch);
  if(!k || !html) return;
  if(RD_CACHE.size >= RD_CACHE_MAX){
    const first = RD_CACHE.keys().next().value;
    if(first) RD_CACHE.delete(first);
  }
  RD_CACHE.set(k, html);
}

function rdNextChapters(ch, n = 2){
  if(!RD.book) return [];
  const list = RD.book.toc;
  const i = list.indexOf(ch);
  if(i < 0) return [];
  const out = [];
  for(let j = i + 1; j < list.length && out.length < n; j++) out.push(list[j]);
  return out;
}

/** 取一章正文；顺手把「后面两章」交给服务端预热，返回时它们多半已经在路上 */
function rdFetch(src, ch){
  if(RD.book.kind === 'rss') return feedContent(src, ch);
  return Book.content(src, ch, RD.book.bookUrl, { next: rdNextChapters(ch), book: RD.book });
}

/** 读完当前章，安静地把下一章取回来（用户翻页时就能秒开） */
let rdPreToken = 0;
function rdPrefetch(){
  if(!RD.book || RD.book.kind === 'rss') return;
  const token = ++rdPreToken;
  const session = RD.session;
  const list = RD.book.toc;
  const want = [list[RD.idx + 1], list[RD.idx + 2], list[RD.idx - 1]]
    .filter(c => c && !rdCacheGet(c));
  if(!want.length) return;

  const src = rdSource();
  if(!src) return;

  (async () => {
    for(const ch of want){
      // 用户已经翻到别处（或直接退出本书）了，就不再继续预取
      if(token !== rdPreToken || session !== RD.session || !RD.book) return;
      try{
        const html = await rdFetch(src, ch);
        // 迟到的预取结果同样不能写进缓存：键里带的是"当时"那本书
        if(html && token === rdPreToken && session === RD.session && RD.book) rdCacheSet(ch, html);
      }catch(e){ /* 预取失败不影响阅读 */ }
      await new Promise(r => setTimeout(r, 250));
    }
  })();
}

function rdPaint(raw, ch, resetScroll){
  $('#rd-content').innerHTML = renderContent(raw, ch.url, ch.name);
  if(RD.book.toc.length === RD.idx + 1) appendEnd();
  const body = $('#rd-body');
  body.scrollTop = 0;
  SLIDE.page = 0; SLIDE.ready = false;

  if(isSlide()){
    updateRdBar();
    // 分栏要等正文真正排版完：等两帧再量宽度，否则量到的是旧布局
    requestAnimationFrame(() => requestAnimationFrame(() => {
      slideLayout(resetScroll && RD.pendingScroll > 0.001);
      saveProgress();
    }));
    return;
  }

  if(resetScroll && RD.pendingScroll > 0.001){
    requestAnimationFrame(() => {
      const max = body.scrollHeight - body.clientHeight;
      body.scrollTop = Math.min(RD.pendingScroll * max, max);
      RD.pendingScroll = 0;
      saveProgress();
    });
  }else{
    saveProgress();
  }
  updateRdBar();
}

function rdReload(){ const i = RD.idx; RD.loading = false; rdGo(i, false); }
function appendEnd(){
  const d = document.createElement('div');
  d.className = 'rd-end';
  d.textContent = '— 本章完 —';
  $('#rd-content').appendChild(d);
}
function rdNext(){ hideRdMenu(true); if(RD.idx < RD.book.toc.length - 1) rdGo(RD.idx + 1, true); else toast('已经是最后一章'); }
function rdPrev(){ hideRdMenu(true); if(RD.idx > 0) rdGo(RD.idx - 1, true); else toast('已经是第一章'); }

/* 点击翻页：轻点右/左半屏走一屏，走到头再点就换章。
   留 44px 重叠，免得最后一行被切成两半。 */
function tapPage(dir){
  const body = $('#rd-body');
  if(!body) return;
  if(isSlide()){ slideTurn(dir); return; }
  const step = Math.max(160, body.clientHeight - 44);
  const maxTop = Math.max(0, body.scrollHeight - body.clientHeight);
  if(dir > 0){
    if(body.scrollTop >= maxTop - 8){ rdNext(); return; }
    body.scrollBy({ top: Math.min(step, maxTop - body.scrollTop), behavior:'smooth' });
  }else{
    if(body.scrollTop <= 8){ rdPrev(); return; }
    body.scrollBy({ top: -Math.min(step, body.scrollTop), behavior:'smooth' });
  }
}

/* ---------- 左右翻页 ----------
   一页 = 一栏。翻页不滚正文，而是把整栏平移过去，到边界才换章。
   手势：右往左滑 = 下一页，左往右滑 = 上一页，跟手拖，松手过阈值才落页。 */
const SLIDE = { page:0, total:1, w:0, ready:false, on:false, sx:0, sy:0, dx:0, dir:'', t0:0, last:0, landLast:false };

function isSlide(){ return (S.settings.reader.paging || 'scroll') === 'slide'; }

function slideInner(){
  const body = $('#rd-body');
  return body ? body.querySelector('.rd-inner') : null;
}

/* 按容器宽度重新分栏。keepRatio 时按 RD.pendingScroll 定位；
   从下一章往回翻（landLast）时直接落到最后一页。 */
function slideLayout(keepRatio){
  const body = $('#rd-body'), inner = slideInner();
  if(!body || !inner) return;
  if(!isSlide()){
    body.removeAttribute('data-paging');
    inner.style.transform = ''; inner.style.columnWidth = '';
    inner.style.columnGap = ''; inner.style.paddingLeft = '';
    inner.style.height = '';
    SLIDE.ready = false;
    return;
  }
  body.setAttribute('data-paging', 'slide');
  const P = 22;
  const w = body.clientWidth || 360;
  // 一页的高度 = 容器内容区高度（扣掉上下安全区留白）。
  // 多栏必须定高，否则 column-fill 会把整章全排在很长的第一栏里，翻页就没意义了。
  const cs = getComputedStyle(body);
  const h = Math.max(200, body.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0));
  inner.style.columnWidth = Math.max(120, w - P * 2) + 'px';
  inner.style.columnGap = (P * 2) + 'px';
  inner.style.paddingLeft = P + 'px';
  inner.style.height = h + 'px';
  SLIDE.w = w;
  const sw = inner.scrollWidth;            // 读一次宽度，逼出实际排版结果
  SLIDE.total = Math.max(1, Math.round((sw - P) / w));
  let target = SLIDE.page;
  if(keepRatio) target = Math.round((RD.pendingScroll || 0) * (SLIDE.total - 1));
  if(SLIDE.landLast) target = SLIDE.total - 1;
  SLIDE.landLast = false;
  RD.pendingScroll = 0;
  slideGoto(target, false);
  SLIDE.ready = true;
}

function slideGoto(p, animate){
  const inner = slideInner();
  if(!inner) return;
  SLIDE.page = Math.max(0, Math.min(p, SLIDE.total - 1));
  if(!animate) inner.classList.add('dragging');
  inner.style.transform = 'translateX(' + (-SLIDE.page * SLIDE.w) + 'px)';
  if(!animate) requestAnimationFrame(() => inner.classList.remove('dragging'));
}

function slideTurn(dir){
  if(!SLIDE.ready) return;
  if(dir > 0){
    if(SLIDE.page < SLIDE.total - 1){ slideGoto(SLIDE.page + 1, true); saveProgress(); return; }
    rdNext();
  }else{
    if(SLIDE.page > 0){ slideGoto(SLIDE.page - 1, true); saveProgress(); return; }
    SLIDE.landLast = true;                 // 往回翻要停在上一章的最后一页
    rdPrev();
  }
}

/* 尺寸或字号变了就重新分栏，尽量保住当前阅读位置 */
function slideRelayout(){
  if(!isSlide()){ slideLayout(false); return; }
  if(!RD.book || !SLIDE.ready){ slideLayout(false); return; }
  const ratio = SLIDE.total > 1 ? SLIDE.page / (SLIDE.total - 1) : 0;
  RD.pendingScroll = ratio;
  slideLayout(true);
}

function updateRdBar(){
  const b = RD.book; if(!b) return;
  const n = b.toc.length || 1;
  const pct = Math.round(((RD.idx + 1) / n) * 100);
  $('#rd-pct').textContent = pct + '%';
  $('#rd-fill').style.width = pct + '%';
  $('#rd-cnt').textContent = `${RD.idx + 1}/${n}`;
  ['#rd-prev','#rd-prev2'].forEach(s => $(s).disabled = RD.idx <= 0);
  ['#rd-next','#rd-next2'].forEach(s => $(s).disabled = RD.idx >= n - 1);
  renderToc();
}

function saveProgress(){
  const b = RD.book; if(!b) return;
  // 加载中不写：正文还没换，此时 RD.idx 已经是下一章了
  if(RD.loading) return;
  const body = $('#rd-body');
  let scroll;
  if(isSlide()){
    // 左右翻页是按页走的，进度就按「第几页 / 总页数」算，格式仍是 0~1，跨模式通用
    scroll = SLIDE.ready && SLIDE.total > 1 ? SLIDE.page / (SLIDE.total - 1) : 0;
  }else{
    const max = body.scrollHeight - body.clientHeight;
    scroll = max > 10 ? (body.scrollTop / max) : 0;
  }
  // 滚动事件很密：位置没变就别每次都写盘 + 推云端
  if(RD.lastSaved && RD.lastSaved.idx === RD.idx && Math.abs(RD.lastSaved.scroll - scroll) < 0.002) return;
  RD.lastSaved = { idx: RD.idx, scroll };
  b.idx = RD.idx;
  b.scroll = scroll;
  b.updatedAt = Date.now();
  const item = S.shelf.find(x => x.id === b.id);
  if(item){ item.idx = b.idx; item.scroll = b.scroll; item.updatedAt = b.updatedAt; }
  saveShelf();
}

function renderToc(){
  const b = RD.book; if(!b) return;
  const box = $('#toc-body');
  if(box.dataset.for !== b.id || box.dataset.n !== String(b.toc.length)){
    box.innerHTML = b.toc.map((c, i) => c.isVol
      ? `<div class="vol">${esc(c.name)}</div>`
      : `<div class="toc-item ${i === RD.idx ? 'cur' : ''}" data-ch="${i}">${esc(c.name)}</div>`
    ).join('');
    box.dataset.for = b.id;
    box.dataset.n = String(b.toc.length);
  }else{
    box.querySelectorAll('.toc-item').forEach(el => el.classList.toggle('cur', +el.dataset.ch === RD.idx));
  }
  $('#toc-title').textContent = `目录 · ${b.toc.length}`;
}

function renderContent(raw, baseUrl, chName){
  // 用 DOMParser 解析：节点在插进页面之前是惰性的，
  // innerHTML 直接塞进游离 div 时，onerror 之类的属性会在插入瞬间就生效
  const tmp = new DOMParser().parseFromString(String(raw), 'text/html').body;
  tmp.querySelectorAll('script,style,noscript,iframe,svg').forEach(n => n.remove());

  const imgs = [];
  tmp.querySelectorAll('img').forEach(n => {
    const u = n.getAttribute('src') || n.getAttribute('data-src') || n.getAttribute('data-original');
    if(u && !/logo|blank|spacer|pixel|1x1/i.test(u)) imgs.push(Rule.abs(u, baseUrl));
    n.remove();
  });

  let text = tmp.innerHTML
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(p|div|h[1-6]|li|tr|section|blockquote)>/gi, '\n')
    .replace(/<[^>]*>/g, '');

  const ta = document.createElement('textarea');
  ta.innerHTML = text;
  text = ta.value;

  let lines = text.split('\n').map(s => s.replace(/\u00a0/g, ' ').replace(/[ \t]+$/,'').trim());

  const freq = {};
  lines.forEach(l => { if(l.length > 3) freq[l] = (freq[l] || 0) + 1; });

  const junk = /^(本章未完|请记住本站|手机版阅读网址|百度搜索|一秒记住|加入书签|投推荐票|上一章|下一章|目录|章节错误|求月票|求推荐|最快更新|本站域名|温馨提示)/;
  lines = lines.filter(l => {
    if(!l) return false;
    if(junk.test(l)) return false;
    if(freq[l] >= 4 && l.length < 60) return false;
    return true;
  });

  // 有些源的正文里带着章节标题，去掉重复的那行
  if(chName && lines.length){
    const a = lines[0].replace(/\s/g, '');
    const b = String(chName).replace(/\s/g, '');
    if(a && b && a.length >= 3 && (b.includes(a) || a.includes(b))) lines.shift();
  }

  const body = lines.map(l => `<p>${esc(l)}</p>`).join('');
  const imgHtml = imgs.slice(0, 12)
    .map(u => `<img src="${esc(imgSrc(u))}" loading="lazy" onerror="this.remove()">`).join('');
  return body + imgHtml;
}

function hideRdMenu(force){

/* =========================================================
   9. 导入 / 导出 / 代理设置
   ========================================================= */
async function importSourcesText(txt){
  const arr = Array.isArray(txt) ? txt : looseParse(txt);
  const books = [], feeds = [];
  for(const raw of arr){
    if(!raw || typeof raw !== 'object') continue;
    if(raw.bookSourceUrl){
      const n = normalizeSource(raw); if(n) books.push(n);
    }else if(raw.sourceUrl){
      // 订阅源不一定有规则：老格式（只有 sourceUrl + singleUrl）走标准 RSS 解析，
      // 以前要求必须有 ruleArticles 才收，结果这类源导入时被静默丢掉了
      const n = normalizeRss(raw); if(n) feeds.push(n);
    }
  }
  if(!books.length && !feeds.length) throw new Error('没识别出书源或订阅源');

  let add = 0, upd = 0, rssAdd = 0;
  for(const s of books){
    const key = s.bookSourceUrl || s.bookSourceName;
    const i = S.sources.findIndex(x => (x.bookSourceUrl || x.bookSourceName) === key);
    if(i >= 0){ S.sources[i] = s; upd++; }
    else { S.sources.push(s); add++; }
  }
  for(const s of feeds){
    const i = S.rss.findIndex(x => x.sourceUrl === s.sourceUrl);
    if(i >= 0) S.rss[i] = s;
    else { S.rss.push(s); rssAdd++; }
  }
  const okSrc = await saveSources();
  const okRss = await DB.set(KEY.RSS, S.rss);
  renderSources();
  renderRss();
  const saved = okSrc && okRss;
  return {
    add, upd, rssAdd,
    total: books.length + feeds.length,
    isRss: !books.length,
    saved,
    saveError: saved ? '' : ((DB.lastError() && DB.lastError().message) || '浏览器存储写入失败'),
  };
}

/**
 * 下载并导入一个书源包。
 * 后端在的话走服务端取（不受 CORS 限制、能扛几 MB 的整合包）；
 * 纯前端模式才退回公共代理。
 */
async function importFromUrl(input){
  const url = String(input || '').trim();
  if(!url) throw new Error('链接是空的');
  if(!/^https?:\/\//i.test(url)) throw new Error('只支持 http/https 链接');

  const t0 = Date.now();
  const st = toastSticky('正在下载书源…');
  const tick = setInterval(() => {
    st.update(`正在下载书源… ${Math.round((Date.now() - t0) / 1000)}s`);
  }, 400);

  let arr = null, via = '', bytes = 0;
  try{
    if(BE.ok){
      const r = await BE.importPack(url);
      arr = r.sources || [];
      bytes = r.bytes || 0;
      via = bytes ? `服务端 ${(bytes / 1048576).toFixed(1)}MB` : '服务端';
      if(r.url && r.url !== url) via += '（已自动换成 JSON 接口）';
    }else{
      const r = await withTimeout(fetchText(url, { timeout: 30000 }), 45000);
      arr = looseParse(r.text);
      bytes = r.text.length;
      via = '前端代理';
    }
  }catch(e){
    clearInterval(tick);
    st.done('下载失败：' + (e.message || e), 6000);
    throw e;
  }
  clearInterval(tick);

  if(!arr || !arr.length){
    const err = new Error('这个链接里没有书源');
    st.done(err.message, 4000);
    throw err;
  }

  st.update(`正在写入 ${arr.length} 个书源…`);
  let res;
  try{
    res = await importSourcesText(arr);
  }catch(e){
    st.done('导入失败：' + (e.message || e), 6000);
    throw e;
  }

  if(!res.saved){
    st.done(`下载了 ${arr.length} 个，但没存住：${res.saveError}`, 8000);
    return res;
  }

  const secs = ((Date.now() - t0) / 1000).toFixed(1);
  st.done(
    `书源 +${res.add}` +
    (res.upd ? ` · 更新 ${res.upd}` : '') +
    (res.rssAdd ? ` · 订阅 +${res.rssAdd}` : '') +
    `（${via}，${secs}s）`,
    Math.max(2600, Math.min(6000, arr.length * 12))
  );
  return res;
}

      }
    ],
    onMount(){
      $('#modal-body').onclick = e => {
        const sw = e.target.closest('[data-px]');
        if(sw){
          const i = +sw.dataset.px;
          S.settings.proxies[i].enabled = !S.settings.proxies[i].enabled;
          sw.classList.toggle('on', S.settings.proxies[i].enabled);
          DB.set(KEY.SET, S.settings);
          return;
        }
        const tg = e.target.closest('.px-tag');
        if(tg) testOne(+tg.dataset.i, tg);
      };
    }
  });
}

async function testOne(i, el){
  const p = S.settings.proxies[i];
  if(!p) return;
  el.textContent = '…';
  el.style.color = 'var(--sub)';
  try{
    const target = buildProxyUrl(p.tpl, 'https://www.baidu.com');
    const r = await fetchT(target, 9000);
    if(!r.ok) throw new Error(r.status);
    const t = await r.text();
    if(t.length < 100) throw new Error('空');
    el.textContent = '可用 ✓';
    el.style.color = '#2e7d32';
  }catch(e){
    el.textContent = '不可用 ✗';
    el.style.color = '#c0392b';
  }
}

async function testProxies(){
  toast('正在逐个测试…', 1200);
  const tags = document.querySelectorAll('.px-tag');
  for(const el of tags){
    await testOne(+el.dataset.i, el);
  }
  toast('测试完成');
}

/* =========================================================
   10. 事件绑定
   ========================================================= */
function bindEvents(){

  /* 标签栏 */
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {

  $('#btn-gosrc').onclick = () => showPage('p-sources');

  $('#search-results').addEventListener('click', e => {
    const row = e.target.closest('.row');

    srcSeg = b.dataset.seg;

  /* 订阅源列表 */
  $('#rss-list').addEventListener('click', e => {
    const tog = e.target.closest('[data-rtoggle]');
    if(tog){
      const i = +tog.dataset.rtoggle;
      S.rss[i].enabled = S.rss[i].enabled === false;

  /* 订阅文章 */
  $('#feed-list').addEventListener('click', e => {

    if(!it || !curFeedSrc || !curFeed) return;
    openReader({
      id: 'feed:' + curFeedSrc.sourceUrl,
      kind: 'rss',

      bookUrl: '',
      // desc/content 必须带上：订阅源的 description 里常常就是全文，
      // 丢了它们就得回头再抓一次页面，白白慢好几秒还不一定能抓到
      toc: curFeed.map(a => ({ name: a.name, url: a.url, desc: a.desc || '', content: a.content || a.desc || '' })),
      idx: 0, scroll: 0
    }, +it.dataset.f, 0);
  });
  $('#feed-back').onclick = () => showPage('p-sources');
  $('#feed-refresh').onclick = () => {
    const i = S.rss.indexOf(curFeedSrc);

  };

  /* 书源 */
  $('#btn-import').onclick = openImportModal;
  $('#btn-import-url').onclick = openUrlImport;
  $('#btn-export').onclick = doExport;
  $('#btn-test').onclick = testSources;
  $('#btn-proxy').onclick = openProxyModal;

  $('#src-list').addEventListener('click', e => {
    const tog = e.target.closest('[data-toggle]');
    if(tog){
      const i = +tog.dataset.toggle;
      S.sources[i].enabled = S.sources[i].enabled === false;
      saveSources();
      renderSources();
      return;
    }
    const del = e.target.closest('[data-del]');
    if(del){
      const i = +del.dataset.del;
      const s = S.sources[i];
      if(confirm(`删除书源「${s.bookSourceName}」？`)){
        S.sources.splice(i, 1);
        saveSources();
        renderSources();
      }
    }
  });

  /* 书架 */
  $('#btn-edit').onclick = () => setShelfEdit(!SHELF_EDIT.on);
  $('#sb-del').onclick = removePicked;
  $('#sb-all').onclick = () => {
    if(SHELF_EDIT.sel.size === S.shelf.length) SHELF_EDIT.sel.clear();
    else S.shelf.forEach(b => SHELF_EDIT.sel.add(b.id));
    renderShelf();
  };

  /* 长按任意一本 → 进编辑态并选中它（手机上不用先去点右上角） */
  const LONG = { timer:0, x:0, y:0, moved:false, suppressUntil:0 };
  const longStart = e => {
    if(SHELF_EDIT.on) return;                    // 已经在编辑态，直接点就行
    const card = e.target.closest('.bookcard');
    if(!card) return;
    LONG.x = e.clientX; LONG.y = e.clientY; LONG.moved = false;
    clearTimeout(LONG.timer);
    LONG.timer = setTimeout(() => {
      if(LONG.moved) return;
      const b = S.shelf[+card.dataset.i];
      if(!b) return;
      LONG.suppressUntil = Date.now() + 800;     // 别让松手后的 click 又把书打开
      if(navigator.vibrate) try{ navigator.vibrate(14); }catch(_e){}
      setShelfEdit(true);
      SHELF_EDIT.sel.add(b.id);
      renderShelf();
      toast('已进入编辑，点选要移出的书', 2200);
    }, 480);
  };
  const longEnd = e => {
    clearTimeout(LONG.timer);
    if(e.type === 'pointermove' && (Math.abs(e.clientX - LONG.x) > 8 || Math.abs(e.clientY - LONG.y) > 8)){
      LONG.moved = true;                          // 在滑动列表，不算长按
    }
  };
  ['pointerdown'].forEach(t => $('#shelf-list').addEventListener(t, longStart, { passive:true }));
  ['pointermove','pointerup','pointercancel','pointerleave'].forEach(t =>
    $('#shelf-list').addEventListener(t, longEnd, { passive:true }));
  // 长按弹系统菜单很烦，直接压掉（编辑态尤其明显）
  $('#shelf-list').addEventListener('contextmenu', e => { if(SHELF_EDIT.on) e.preventDefault(); });

  $('#shelf-list').addEventListener('click', async e => {
    const card = e.target.closest('.bookcard');
    if(!card) return;
    const i = +card.dataset.i;
    const b = S.shelf[i];
    if(!b) return;

    // 编辑态：点一下就选中 / 取消
    if(SHELF_EDIT.on){ togglePick(card, b.id); return; }
    // 长按刚触发过，别顺手把书打开
    if(Date.now() < LONG.suppressUntil) return;

    if(!b.toc || !b.toc.length){
      const src = S.sources.find(s => s.bookSourceUrl === b.sourceUrl);
      if(!src){ toast('这本书用的书源还没导到这台设备，去「书源」页导入同一个源包即可', 4000); return; }
      toast('正在拉取目录…', 3000);
      try{
        const info = await Book.info(src, { ...b, hasDetail:true });
        const t = await Book.toc(src, b, info);
        b.toc = t.list;
        b.tocUrl = t.tocUrl || info.tocUrl || '';
        saveShelf();
      }catch(err){
        toast('目录拉取失败：' + err.message, 3000);
        return;
      }
    }
    openReader(b, b.idx || 0, b.scroll || 0);
  });

  /* 阅读器 */
  $('#rd-back').onclick = closeReader;
  $('#rd-prev').onclick = rdPrev;
  $('#rd-next').onclick = rdNext;
  $('#rd-prev2').onclick = rdPrev;
  $('#rd-next2').onclick = rdNext;
  $('#rd-set').onclick = () => { showSheet('#sheet-set'); };
  $('#rd-set2').onclick = () => { showSheet('#sheet-set'); };
  $('#rd-toc2').onclick = () => { renderToc(); showSheet('#sheet-toc'); };
  /* 底部「昼夜」：白天/夜间一键切，顺带把状态栏颜色也跟着变 */
  $('#rd-night').onclick = () => {
    const r = S.settings.reader;
    r.theme = r.theme === 'dark' ? 'paper' : 'dark';
    applyReaderStyle(); saveSettings();
  };
  $('#rd-full').onclick = toggleFullscreen;
  $('#rd-fav').onclick = toggleFav;
  $('#rd-tips-ok').onclick = () => hideTips(true);

  $('#rd-body').addEventListener('click', e => {
    if(e.target.closest('button')) return;
    // 边缘滑动刚结束的那一下不算点击，否则会顺手翻一页
    if(Date.now() < (EDGE.suppressUntil || 0)) return;
    // 选中文字时不触发
    const sel = window.getSelection();
    if(sel && sel.toString().length > 0) return;
    syncMask();   // 兜底：正文可点时，遮罩一定不该还在
    // 新手提示还开着时，这一下先把它收掉；但动作照常执行，
    // 否则首次打开的用户会觉得“第一下点击没反应”。
    if(!$('#rd-tips').hidden) hideTips(true);
    // 左 40% 上一页 / 右 40% 下一页 / 中间 20% 唤出工具条
    const pg = S.settings.reader.paging || 'scroll';
    if(pg === 'slide' || pg === 'tap'){
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = rect.width ? (e.clientX - rect.left) / rect.width : 0.5;
      if(ratio < 0.4){ tapPage(-1); return; }
      if(ratio > 0.6){ tapPage(1); return; }
    }
    hideRdMenu();
  });

  /* ---------- 左边缘右滑：退出本书 ----------
     iOS 的返回手势逻辑：只有从贴边 26px 内起手、且移动方向明确是横向才接管，
     纵向滚动一律放行。跟手位移 + 松手过阈值才真退出，避免误触。 */
  const EDGE = { on:false, sx:0, sy:0, dx:0, dir:'', fired:false, t0:0, last:0, suppressUntil:0 };

  $('#rd-body').addEventListener('touchstart', e => {
    EDGE.on = false; EDGE.dir = ''; EDGE.dx = 0; EDGE.fired = false;
    if(!RD.book || e.touches.length !== 1) return;
    const t = e.touches[0];
    const r = e.currentTarget.getBoundingClientRect();
    if(t.clientX - r.left > 26) return;        // 必须贴左边缘
    EDGE.on = true;
    EDGE.sx = t.clientX; EDGE.sy = t.clientY;
    EDGE.t0 = Date.now(); EDGE.last = EDGE.t0;
  }, { passive:true });

  $('#rd-body').addEventListener('touchmove', e => {
    if(!EDGE.on || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - EDGE.sx, dy = t.clientY - EDGE.sy;
    if(!EDGE.dir){
      if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if(Math.abs(dx) <= Math.abs(dy) * 1.3){ EDGE.on = false; return; }  // 纵向：交给滚动
      if(dx <= 0){ EDGE.on = false; return; }                            // 往左滑：不是返回
      EDGE.dir = 'h';
    }
    e.preventDefault();                        // 接管本次手势，别再滚正文
    EDGE.fired = true;
    EDGE.dx = Math.max(0, dx);
    EDGE.last = Date.now();
    const rd = $('#reader');
    rd.style.transition = 'none';
    rd.style.transform = 'translateX(' + EDGE.dx + 'px)';
  }, { passive:false });

  function edgeEnd(){
    if(!EDGE.on) return;
    EDGE.on = false;
    const rd = $('#reader');
    const w = rd.clientWidth || 390;
    const dt = Math.max(60, (EDGE.last || EDGE.t0) - EDGE.t0) / 1000;
    const fast = EDGE.dx > 40 && (EDGE.dx / dt) > 700;     // 快速轻扫也算
    const ok = EDGE.dx > Math.min(130, w * 0.28) || fast;
    rd.style.transition = 'transform .18s ease';
    if(ok){
      rd.style.transform = 'translateX(' + w + 'px)';
      setTimeout(() => {
        closeReader();
        rd.style.transition = 'none';
        rd.style.transform = '';
      }, 175);
    }else{
      rd.style.transform = '';
    }
    if(EDGE.fired) EDGE.suppressUntil = Date.now() + 380;
  }
  $('#rd-body').addEventListener('touchend', edgeEnd);
  $('#rd-body').addEventListener('touchcancel', edgeEnd);

  /* ---------- 左右翻页手势 ----------
     只接管「起点不在左边缘 26px 内」的横向滑动：贴边那一条留给退出本书，
     否则两套手势会在同一个位置抢。纵向一律放行，交给滚动。 */
  $('#rd-body').addEventListener('touchstart', e => {
    SLIDE.on = false; SLIDE.dir = ''; SLIDE.dx = 0;
    if(!isSlide() || !RD.book || e.touches.length !== 1) return;
    const t = e.touches[0];
    const r = e.currentTarget.getBoundingClientRect();
    if(t.clientX - r.left <= 26) return;
    SLIDE.on = true;
    SLIDE.sx = t.clientX; SLIDE.sy = t.clientY;
    SLIDE.t0 = SLIDE.last = Date.now();
  }, { passive:true });

  $('#rd-body').addEventListener('touchmove', e => {
    if(!SLIDE.on || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - SLIDE.sx, dy = t.clientY - SLIDE.sy;
    if(!SLIDE.dir){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if(Math.abs(dx) <= Math.abs(dy)){ SLIDE.on = false; return; }   // 纵向：不拦
      SLIDE.dir = 'h';
    }
    e.preventDefault();
    SLIDE.last = Date.now();
    // 已经在首页还想往回拉、或在末页还想往前拉：给三成阻尼，拉得动一点但拉不过去
    let d = dx;
    if((SLIDE.page === 0 && dx > 0) || (SLIDE.page >= SLIDE.total - 1 && dx < 0)) d = dx * 0.32;
    SLIDE.dx = d;
    const inner = slideInner();
    if(inner){
      inner.classList.add('dragging');
      inner.style.transform = 'translateX(' + (-SLIDE.page * SLIDE.w + d) + 'px)';
    }
  }, { passive:false });

  $('#rd-body').addEventListener('touchend', () => {
    if(!SLIDE.on) return;
    SLIDE.on = false;
    const inner = slideInner();
    if(!inner) return;
    inner.classList.remove('dragging');
    const dt = Math.max(60, (SLIDE.last || SLIDE.t0) - SLIDE.t0) / 1000;
    const dist = Math.abs(SLIDE.dx);
    const fast = dist > 40 && (dist / dt) > 700;              // 快速轻扫也算翻页
    const ok = dist > Math.min(130, (SLIDE.w || 360) * 0.22) || fast;
    if(!ok){ slideGoto(SLIDE.page, true); return; }           // 没到阈值：弹回去
    if(SLIDE.dx < 0) slideTurn(1); else slideTurn(-1);        // 左滑下一页 / 右滑上一页
  });

  window.addEventListener('resize', () => { if(isSlide()) slideRelayout(); });

  let stTimer = null;
  $('#rd-body').addEventListener('scroll', () => {
    clearTimeout(stTimer);
    stTimer = setTimeout(saveProgress, 700);
  }, { passive:true });

  /* 目录抽屉 */
  $('#toc-body').addEventListener('click', e => {
    const it = e.target.closest('[data-ch]');
    if(!it) return;
    const i = +it.dataset.ch;
    hideSheet();
    rdGo(i, true);
  });

  $('#toc-rev').onclick = () => {
    if(!RD.book) return;
    RD.book.toc.reverse();
    RD.idx = RD.book.toc.length - 1 - RD.idx;
    const box = $('#toc-body');
    box.dataset.for = '';
    renderToc();
    updateRdBar();
    saveProgress();
  };

  /* 遮罩 / 关闭 */
  // 注意：必须包一层。直接绑定 hideSheet 会把 Event 对象当成 keepMask 传进去，
  // 导致遮罩的 show 类永远留着 —— 全屏暗层吃掉所有点击（触控失灵 + 界面变暗）。
  $('#mask').onclick = () => hideSheet();
  document.querySelectorAll('[data-close]').forEach(b => { b.onclick = () => hideSheet(); });

  /* 阅读设置 */
  $('#set-fs').oninput = e => { S.settings.reader.fs = +e.target.value; applyReaderStyle(); saveSettings(); };
  $('#set-lh').oninput = e => { S.settings.reader.lh = +e.target.value; applyReaderStyle(); saveSettings(); };
  $('#set-pg').oninput = e => { S.settings.reader.pg = +e.target.value; applyReaderStyle(); saveSettings(); };
  // 滑块向右拉 = 变亮，所以存之前先取反
  $('#set-dim').oninput = e => { S.settings.reader.dim = 60 - (+e.target.value); applyReaderStyle(); saveSettings(); };

  document.querySelectorAll('[data-rdtheme]').forEach(b => {
    b.onclick = () => { S.settings.reader.theme = b.dataset.rdtheme; applyReaderStyle(); saveSettings(); };
  });
  document.querySelectorAll('[data-paging]').forEach(b => {
    b.onclick = () => { S.settings.reader.paging = b.dataset.paging; applyReaderStyle(); saveSettings(); };
  });
  /* 字体按钮由 renderFontChips() 动态生成并绑定（只列真机装了的字体） */

  /* 键盘（外接键盘 / iPad） */
  document.addEventListener('keydown', e => {
    if(!$('#reader').classList.contains('show')) return;
    if(e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); rdNext(); }
    if(e.key === 'ArrowLeft') { e.preventDefault(); rdPrev(); }
    if(e.key === 'Escape') closeReader();
  });

  /* 离开页面保存 */
  window.addEventListener('pagehide', saveProgress);
  document.addEventListener('visibilitychange', () => { if(document.hidden) saveProgress(); });
}

let setTimer = null;
function saveSettings(){
  clearTimeout(setTimer);
  setTimer = setTimeout(() => DB.set(KEY.SET, S.settings), 400);
}

function showSheet(sel){
  hideSheet(true);
  $(sel).classList.add('show');
  $('#mask').classList.add('show');
}
function hideSheet(keepMask){
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('show'));
  // 严格只认布尔 true：防止误把事件对象当参数传进来（会让遮罩永久留在屏幕上）
  if(keepMask !== true) $('#mask').classList.remove('show');
}
// 自愈：任何时刻只要没有抽屉在显示，遮罩就不该存在（挡住触控 + 压暗界面）
function syncMask(){
  if(!document.querySelector('.sheet.show')) $('#mask').classList.remove('show');
}

/* =========================================================
   11. 初始化
   ========================================================= */
(async function init(){
  // 探测是否部署在带后端的环境；能连上就把规则求值整体交给服务端
  if(await BE.boot()){
    installBackend();
    document.documentElement.classList.add('has-backend');
    SHELF_SYNC.on = true;          // 有后端才谈得上跨设备
  }

  try{
    const [src, rss, shelf, set] = await Promise.all([
      DB.get(KEY.SRC), DB.get(KEY.RSS), DB.get(KEY.SHELF), DB.get(KEY.SET)
    ]);
    if(Array.isArray(src)) S.sources = src.map(normalizeSource).filter(Boolean);
    if(Array.isArray(rss)) S.rss = rss.map(normalizeRss).filter(Boolean);
    if(Array.isArray(shelf)) S.shelf = shelf;
    if(set){
      S.settings = Object.assign({}, S.settings, set);
      S.settings.reader = Object.assign({ fs:19, lh:19, pg:10, dim:0, theme:'paper', font:'sys', paging:'slide', fontCustom:'' }, set.reader || {});
    }
  }catch(e){}

  renderSources();
  renderRss();
  renderShelf();
  renderFontChips();      // 探测真机字体，只列能用的
  applyReaderStyle();
  bindEvents();
  const stamp = $('#build-stamp');
  if(stamp) stamp.textContent = '构建 ' + APP_BUILD;
  const note = $('#sync-note');
  if(note) note.textContent = SHELF_SYNC.on
    ? '书架：云端同步（手机 / 电脑共用一份）'
    : '书架：仅本机保存（未连接服务端）';

  /* 书架对齐：新设备一进来就把云端那份并进来；
     手机读完切回电脑（或反过来）时靠 visibilitychange 再对一次。 */
  if(SHELF_SYNC.on){
    const n = await syncPull();
    if(n) renderShelf();
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') syncPull();
    });
    window.addEventListener('focus', () => syncPull());
  }

  /* 书源对齐：主屏 PWA 是独立存储容器，Safari 里导入的源到这里是空的，
     从服务端补回来（书架能跨入口、书源也得能）。 */
  if(BE.ok){
    const nSrc = await syncSourcesPull();
    if(nSrc) renderSources();
  }

  // 内置书源：按版本号增量合并。
  // 以前只在「本地一个源都没有」时才铺，导致已经打开过的人永远拿不到后来更新的源。
  if(BE.ok){
    try{
      const PK = 'presetVer.v1';
      const localVer = localStorage.getItem(PK) || '';
      const srvVer = await BE.presetVersion();
      if(srvVer && srvVer !== localVer){
        const { sources: preset } = await BE.preset();
        if(preset.length){
          const have = new Set(S.sources.map(x => String(x.bookSourceUrl || '')));
          const add = preset.filter(x => x && x.bookSourceUrl && !have.has(String(x.bookSourceUrl)));
          if(add.length){
            await importSourcesText(JSON.stringify(add));
            toast(`内置书源已更新：新增 ${add.length} 个（共 ${S.sources.length} 个）`, 3200);
          }
          localStorage.setItem(PK, srvVer);
        }
      }
    }catch(e){ /* 内置源同步失败不影响使用 */ }
  }

  if(!S.sources.length){
    $('#search-status').textContent = '第一次用？先去「书源」导入，或者点右上角「源」';
  }

  // 支持 ?import= 远程书源
  const q = new URLSearchParams(location.search);
  const fromUrl = q.get('booksource') || q.get('import');
  if(fromUrl){
    importFromUrl(fromUrl).catch(() => {});
  }
})();
</script>
</body>
</html>
